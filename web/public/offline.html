<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111923" />
    <title>ENGLISHGO - Đang ngoại tuyến</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #111923;
        color: #f3f6fa;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 440px;
        padding: 28px;
        border: 1px solid #263345;
        border-radius: 20px;
        background: #182330;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      h1 { margin: 0 0 12px; font-size: 24px; color: #e9b25d; }
      p { margin: 0 0 20px; line-height: 1.6; color: #b7c4d6; }
      button {
        padding: 12px 18px;
        border: 0;
        border-radius: 12px;
        background: #e9b25d;
        color: #111923;
        font: 700 15px/1 inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Chưa có kết nối mạng</h1>
      <p>ENGLISHGO cần mạng để đồng bộ tiến độ học và tải đề mới. Kiểm tra kết nối rồi thử tải lại trang.</p>
      <button type="button" onclick="window.location.reload()">Thử lại</button>
    </main>
  </body>
</html>
