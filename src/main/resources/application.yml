spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: englishwebapp
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  media-base-url: ${MEDIA_BASE_URL:http://localhost:8080/media}
  upload-dir: ${UPLOAD_DIR:uploads}
  firebase:
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
    web-api-key: ${FIREBASE_WEB_API_KEY:}
    auth-domain: ${FIREBASE_AUTH_DOMAIN:}
    project-id: ${FIREBASE_PROJECT_ID:}
    app-id: ${FIREBASE_APP_ID:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  dautoeic:
    supabase-url: ${DAUTOEIC_SUPABASE_URL:https://qfhmnlvgweznzcsoijyr.supabase.co}
    anon-key: ${DAUTOEIC_ANON_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmaG1ubHZnd2V6bnpjc29panlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg4MDYyMzQsImV4cCI6MjA4NDM4MjIzNH0.mNJAoc-uJVilLr03PT3luXsekfwJ4sICOIsOIRQu-N0}
    media-base-url: ${DAUTOEIC_MEDIA_BASE_URL:https://qfhmnlvgweznzcsoijyr.supabase.co/storage/v1/object/public/mock-test-media}

