<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher CMS</title>
    <style>
        body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f5f7fb; color: #172033; }
        header { display: flex; justify-content: space-between; padding: 18px 28px; background: #fff; border-bottom: 1px solid #d9e1ec; }
        main { width: min(96vw, 1180px); margin: 32px auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
        a { color: #2563eb; font-weight: 700; text-decoration: none; }
        section { background: #fff; border: 1px solid #d9e1ec; border-radius: 8px; padding: 18px; }
        label { display: grid; gap: 6px; margin: 10px 0; font-weight: 700; color: #42526a; }
        input, textarea, select { border: 1px solid #c8d3e1; border-radius: 6px; padding: 10px; font: inherit; }
        textarea { min-height: 90px; resize: vertical; }
        button { border: 0; border-radius: 6px; padding: 10px 14px; background: #172033; color: #fff; font-weight: 700; }
        ul { padding-left: 18px; }
    </style>
</head>
<body>
<header><strong>Teacher CMS</strong><a href="/">Home</a></header>
<main>
    <section>
        <h2>Create test</h2>
        <form method="post" action="/teacher/cms/tests">
            <label>Title <input name="title" required></label>
            <label>Type <input name="type" value="TOEIC" required></label>
            <label>Duration <input name="duration" type="number" value="20" min="1" required></label>
            <label>Difficulty <input name="difficulty" value="EASY"></label>
            <button type="submit">Save test</button>
        </form>
        <h3>Recent tests</h3>
        <ul><li th:each="test : ${tests}" th:text="${test.title}">Test</li></ul>
    </section>

    <section>
        <h2>Create question</h2>
        <form method="post" action="/teacher/cms/questions">
            <label>Test
                <select name="testId" required>
                    <option th:each="test : ${tests}" th:value="${test.id}" th:text="${test.title}">Test</option>
                </select>
            </label>
            <label>Part <input name="part" type="number" value="5" min="1" required></label>
            <label>Type <input name="type" value="MULTIPLE_CHOICE" required></label>
            <label>Content <textarea name="content" required></textarea></label>
            <label>Audio URL <input name="audioUrl" placeholder="audio/example.mp3"></label>
            <label>Image URL <input name="imageUrl" placeholder="images/example.png"></label>
            <label>Explanation <textarea name="explanation"></textarea></label>
            <label>Option A <input name="optionA"></label>
            <label>Option B <input name="optionB"></label>
            <label>Option C <input name="optionC"></label>
            <label>Option D <input name="optionD"></label>
            <label>Correct option <input name="correctOption" value="A"></label>
            <button type="submit">Save question</button>
        </form>
    </section>

    <section>
        <h2>Create vocabulary</h2>
        <form method="post" action="/teacher/cms/vocab-sets">
            <label>Set title <input name="title" required></label>
            <label>Topic <input name="topic" required></label>
            <label>Level <input name="level"></label>
            <button type="submit">Save set</button>
        </form>
        <form method="post" action="/teacher/cms/vocab-words">
            <label>Set
                <select name="setId" required>
                    <option th:each="set : ${vocabSets}" th:value="${set.id}" th:text="${set.title}">Set</option>
                </select>
            </label>
            <label>Word <input name="word" required></label>
            <label>Meaning <textarea name="meaning" required></textarea></label>
            <label>Phonetic <input name="phonetic"></label>
            <label>Example <textarea name="example"></textarea></label>
            <label>Audio URL <input name="audioUrl" placeholder="audio/word.mp3"></label>
            <button type="submit">Save word</button>
        </form>
    </section>

    <section>
        <h2>Create lesson</h2>
        <form method="post" action="/teacher/cms/lessons">
            <label>Title <input name="title" required></label>
            <label>Topic <input name="topic" required></label>
            <label>Content <textarea name="content" required></textarea></label>
            <label>Video URL <input name="videoUrl"></label>
            <button type="submit">Save lesson</button>
        </form>
        <h3>Recent lessons</h3>
        <ul><li th:each="lesson : ${lessons}" th:text="${lesson.title}">Lesson</li></ul>
    </section>
</main>
</body>
</html>
