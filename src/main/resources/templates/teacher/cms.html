<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher CMS</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/shell :: topbar('Teacher CMS', 'Create free learning content and seed practice material')}"></div>
        <main class="app-content wide">
            <div class="card-grid">
                <section class="ew-card">
                    <h2>Create test</h2>
                    <form method="post" action="/teacher/cms/tests">
                        <label class="form-field">Title <input name="title" required></label>
                        <label class="form-field">Type <input name="type" value="TOEIC" required></label>
                        <label class="form-field">Duration <input name="duration" type="number" value="20" min="1" required></label>
                        <label class="form-field">Difficulty <input name="difficulty" value="EASY"></label>
                        <button type="submit">Save test</button>
                    </form>
                    <h3>Recent tests</h3>
                    <ul><li th:each="test : ${tests}" th:text="${test.title}">Test</li></ul>
                </section>

                <section class="ew-card">
                    <h2>Create question</h2>
                    <form method="post" action="/teacher/cms/questions">
                        <label class="form-field">Test
                            <select name="testId" required>
                                <option th:each="test : ${tests}" th:value="${test.id}" th:text="${test.title}">Test</option>
                            </select>
                        </label>
                        <label class="form-field">Part <input name="part" type="number" value="5" min="1" required></label>
                        <label class="form-field">Type <input name="type" value="MULTIPLE_CHOICE" required></label>
                        <label class="form-field">Content <textarea name="content" required></textarea></label>
                        <label class="form-field">Audio URL <input name="audioUrl" placeholder="audio/example.mp3"></label>
                        <label class="form-field">Image URL <input name="imageUrl" placeholder="images/example.png"></label>
                        <label class="form-field">Explanation <textarea name="explanation"></textarea></label>
                        <label class="form-field">Option A <input name="optionA"></label>
                        <label class="form-field">Option B <input name="optionB"></label>
                        <label class="form-field">Option C <input name="optionC"></label>
                        <label class="form-field">Option D <input name="optionD"></label>
                        <label class="form-field">Correct option <input name="correctOption" value="A"></label>
                        <button type="submit">Save question</button>
                    </form>
                </section>

                <section class="ew-card">
                    <h2>Create vocabulary</h2>
                    <form method="post" action="/teacher/cms/vocab-sets">
                        <label class="form-field">Set title <input name="title" required></label>
                        <label class="form-field">Topic <input name="topic" required></label>
                        <label class="form-field">Level <input name="level"></label>
                        <button type="submit">Save set</button>
                    </form>
                    <form method="post" action="/teacher/cms/vocab-words">
                        <label class="form-field">Set
                            <select name="setId" required>
                                <option th:each="set : ${vocabSets}" th:value="${set.id}" th:text="${set.title}">Set</option>
                            </select>
                        </label>
                        <label class="form-field">Word <input name="word" required></label>
                        <label class="form-field">Meaning <textarea name="meaning" required></textarea></label>
                        <label class="form-field">Phonetic <input name="phonetic"></label>
                        <label class="form-field">Example <textarea name="example"></textarea></label>
                        <label class="form-field">Audio URL <input name="audioUrl" placeholder="audio/word.mp3"></label>
                        <button type="submit">Save word</button>
                    </form>
                </section>

                <section class="ew-card">
                    <h2>Create lesson</h2>
                    <form method="post" action="/teacher/cms/lessons">
                        <label class="form-field">Title <input name="title" required></label>
                        <label class="form-field">Topic <input name="topic" required></label>
                        <label class="form-field">Content <textarea name="content" required></textarea></label>
                        <label class="form-field">Video URL <input name="videoUrl"></label>
                        <button type="submit">Save lesson</button>
                    </form>
                    <h3>Recent lessons</h3>
                    <ul><li th:each="lesson : ${lessons}" th:text="${lesson.title}">Lesson</li></ul>
                </section>
            </div>
        </main>
    </div>
    <div th:replace="~{fragments/shell :: mobileNav}"></div>
</div>
<script th:src="@{/js/app-shell.js}"></script>
</body>
</html>
