<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnglishWebApp</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 28px;
            background: #ffffff;
            border-bottom: 1px solid #d9e1ec;
        }

        main {
            width: min(92vw, 920px);
            margin: 42px auto;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        section {
            background: #ffffff;
            border: 1px solid #d9e1ec;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 18px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
        }

        @media (max-width: 680px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }

        .stat {
            border: 1px solid #d9e1ec;
            border-radius: 8px;
            padding: 18px;
            background: #f8fbff;
        }

        .stat span {
            display: block;
            color: #5f6f86;
            font-size: 0.92rem;
        }

        .stat strong {
            display: block;
            margin-top: 8px;
            font-size: 2rem;
            line-height: 1;
        }

        dl {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 10px 18px;
            margin: 0;
        }

        dt {
            font-weight: 700;
            color: #42526a;
        }

        dd {
            margin: 0;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 10px 14px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            background: #172033;
            color: #ffffff;
        }

        a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        .actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        canvas {
            margin-top: 20px;
            max-height: 260px;
        }
    </style>
</head>
<body>
<header>
    <h1>EnglishWebApp</h1>
    <button id="logout-button" type="button">Sign out</button>
</header>

<main>
    <section>
        <h2>Dashboard</h2>
        <div class="stats">
            <div class="stat">
                <span>Completed tests</span>
                <strong th:text="${dashboard.completedTests()}">0</strong>
            </div>
            <div class="stat">
                <span>Average score</span>
                <strong th:text="${dashboard.averageScore()}">0.00</strong>
            </div>
            <div class="stat">
                <span>Mastered words</span>
                <strong th:text="${dashboard.masteredWords()}">0</strong>
            </div>
            <div class="stat">
                <span>Learning streak</span>
                <strong><span th:text="${dashboard.streakDays()}">0</span>d</strong>
            </div>
        </div>
        <canvas id="scoreChart" aria-label="Recent score chart"></canvas>
    </section>

    <section>
        <dl>
            <dt>Email</dt>
            <dd th:text="${user.email()}">user@example.com</dd>
            <dt>Name</dt>
            <dd th:text="${user.displayName()} ?: 'Unnamed user'">Unnamed user</dd>
            <dt>Role</dt>
            <dd th:text="${user.role()}">STUDENT</dd>
        </dl>
        <div class="actions">
            <a href="/tests">Practice tests</a>
            <a href="/history">Attempt history</a>
            <a href="/vocab">Vocabulary</a>
            <a href="/lessons">Lessons</a>
            <a href="/billing">Billing</a>
            <a href="/community">Community</a>
            <a href="/ai/writing">AI writing</a>
            <a href="/teacher/cms" th:if="${user.role().name() == 'TEACHER' or user.role().name() == 'ADMIN'}">Teacher CMS</a>
        </div>
    </section>
</main>

<script th:inline="javascript">
    const scoreLabels = [[${dashboard.scoreLabels()}]];
    const scoreValues = [[${dashboard.scoreValues()}]];
    if (scoreLabels.length > 0) {
        new Chart(document.getElementById("scoreChart"), {
            type: "line",
            data: {
                labels: scoreLabels,
                datasets: [{
                    label: "Recent scores",
                    data: scoreValues,
                    borderColor: "#2563eb",
                    backgroundColor: "rgba(37, 99, 235, 0.12)",
                    tension: 0.25,
                    fill: true
                }]
            },
            options: {responsive: true, scales: {y: {beginAtZero: true, max: 100}}}
        });
    }

    document.getElementById("logout-button").addEventListener("click", async () => {
        await fetch("/auth/logout", {method: "POST"});
        window.location.href = "/login";
    });
</script>
</body>
</html>
