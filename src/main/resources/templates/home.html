<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnglishWebApp</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 28px;
            background: #ffffff;
            border-bottom: 1px solid #d9e1ec;
        }

        main {
            width: min(92vw, 920px);
            margin: 42px auto;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        section {
            background: #ffffff;
            border: 1px solid #d9e1ec;
            border-radius: 8px;
            padding: 24px;
        }

        dl {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 10px 18px;
            margin: 0;
        }

        dt {
            font-weight: 700;
            color: #42526a;
        }

        dd {
            margin: 0;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 10px 14px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            background: #172033;
            color: #ffffff;
        }
    </style>
</head>
<body>
<header>
    <h1>EnglishWebApp</h1>
    <button id="logout-button" type="button">Sign out</button>
</header>

<main>
    <section>
        <dl>
            <dt>Email</dt>
            <dd th:text="${user.email()}">user@example.com</dd>
            <dt>Name</dt>
            <dd th:text="${user.displayName()} ?: 'Unnamed user'">Unnamed user</dd>
            <dt>Role</dt>
            <dd th:text="${user.role()}">STUDENT</dd>
        </dl>
    </section>
</main>

<script>
    document.getElementById("logout-button").addEventListener("click", async () => {
        await fetch("/auth/logout", {method: "POST"});
        window.location.href = "/login";
    });
</script>
</body>
</html>
