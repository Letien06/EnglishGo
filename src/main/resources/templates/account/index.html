<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản - ENGLISHGO</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v='app-shell-20260702-3')}">
</head>
<body class="dash-body account-body">
<header th:replace="~{fragments/public-header :: main('account')}"></header>

<main class="account-main">
    <section class="account-hero">
        <div>
            <span class="account-kicker">TÀI KHOẢN</span>
            <h1>Thông tin cá nhân</h1>
            <p>Chỉnh sửa tên hiển thị, ảnh đại diện và thông tin đăng nhập của bạn.</p>
        </div>
        <button class="ew-button secondary compact" type="button" data-logout-button>Đăng xuất</button>
    </section>

    <section class="ew-alert" th:if="${message}" th:text="${message}">Đã lưu thay đổi.</section>

    <div class="account-page">
                <aside class="account-menu" aria-label="Account menu">
                    <div class="account-menu-group">
                        <span class="account-menu-title">TÀI KHOẢN</span>
                        <a class="account-menu-link"
                           href="/account?tab=profile"
                           th:classappend="${activeTab == 'profile'} ? ' is-active'">
                            <span>👤</span>
                            <strong>Thông tin cá nhân</strong>
                        </a>
                        <a class="account-menu-link"
                           href="/account?tab=password"
                           th:classappend="${activeTab == 'password'} ? ' is-active'">
                            <span>🔒</span>
                            <strong>Đổi mật khẩu</strong>
                        </a>
                        <a class="account-menu-link"
                           href="/account?tab=devices"
                           th:classappend="${activeTab == 'devices'} ? ' is-active'">
                            <span>▯</span>
                            <strong>Thiết bị</strong>
                        </a>
                    </div>
                </aside>

                <section class="account-panel" th:if="${activeTab == 'profile'}">
                    <form method="post" action="/account/profile" th:object="${profileForm}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" th:field="*{avatarUrl}" id="avatarUrl">

                        <div class="account-profile-avatar">
                            <div class="account-avatar">
                                <img th:if="${!#strings.isEmpty(profileForm.avatarUrl)}" th:src="${profileForm.avatarUrl}" alt="Ảnh đại diện">
                                <span th:unless="${!#strings.isEmpty(profileForm.avatarUrl)}" th:text="${#strings.substring(settings.email(), 0, 1)}">U</span>
                            </div>
                            <button class="ew-button secondary compact" type="button" data-avatar-button>Đổi ảnh</button>
                        </div>

                        <label class="form-field">Tên hiển thị
                            <input th:field="*{displayName}" maxlength="150" required>
                            <span class="field-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}">Tên không hợp lệ</span>
                        </label>

                        <label class="form-field">Email
                            <input th:value="${settings.email()}" readonly>
                        </label>

                        <button type="submit">Lưu thay đổi</button>
                    </form>
                </section>

                <section class="account-panel" th:if="${activeTab == 'password'}">
                    <h2>Cập nhật mật khẩu đăng nhập</h2>
                    <form method="post" action="/account/password" th:object="${passwordForm}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="field-error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Could not update password</div>

                        <label class="form-field">Mật khẩu mới
                            <input th:field="*{newPassword}" type="password" autocomplete="new-password" placeholder="Nhập mật khẩu mới">
                            <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">Mật khẩu không hợp lệ</span>
                        </label>

                        <label class="form-field">Xác nhận mật khẩu
                            <input th:field="*{confirmPassword}" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới">
                            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Mật khẩu không hợp lệ</span>
                            <span class="field-error" th:if="${#fields.hasErrors('confirmed')}" th:errors="*{confirmed}">Mật khẩu không khớp</span>
                        </label>

                        <button type="submit">Đổi mật khẩu</button>
                    </form>
                </section>

                <section class="account-panel" th:if="${activeTab == 'devices'}">
                    <h2>Quản lý các thiết bị đã đăng nhập</h2>
                    <article class="device-row" th:each="device : ${devices}">
                        <span class="device-icon">▯</span>
                        <span>
                            <strong th:text="${device.name()}">desktop</strong>
                            <small>Lần cuối: <span th:text="${device.lastSeen()}">28/6/2026</span></small>
                        </span>
                    </article>
                </section>
    </div>
</main>
<script th:src="@{/js/app-shell.js(v='app-shell-20260702-3')}"></script>
<script>
    const avatarButton = document.querySelector("[data-avatar-button]");
    if (avatarButton) {
        avatarButton.addEventListener("click", () => {
            const input = document.getElementById("avatarUrl");
            const nextUrl = window.prompt("Nhập URL ảnh đại diện", input.value || "");
            if (nextUrl !== null) {
                input.value = nextUrl.trim();
            }
        });
    }
</script>
</body>
</html>
