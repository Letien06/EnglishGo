<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="app-sidebar">
    <a class="app-brand" href="/">
        <span class="app-brand-mark">E</span>
        <span>
            <strong>ENGLISHGO</strong>
            <small>Free TOEIC practice</small>
        </span>
    </a>

    <nav class="app-nav" aria-label="Primary navigation">
        <a th:each="item : ${navItems}"
           th:href="@{${item.href}}"
           class="app-nav-link"
           th:classappend="${item.href == '/' ? currentPath == '/' : #strings.startsWith(currentPath, item.href)} ? ' is-active'">
            <span class="app-nav-icon" th:text="${item.shortLabel}">D</span>
            <span th:text="${item.label}">Dashboard</span>
        </a>
    </nav>

    <div class="app-sidebar-note">
        <strong>Free-first content</strong>
        <span>Practice content is loaded from public learning APIs and community resources.</span>
    </div>
</aside>

<header th:fragment="topbar(pageTitle, pageSubtitle)" class="app-topbar">
    <div>
        <p class="app-eyebrow">Learning workspace</p>
        <h1 th:text="${pageTitle}">Dashboard</h1>
        <p th:if="${pageSubtitle != null}" th:text="${pageSubtitle}">Track your progress</p>
    </div>
    <div class="app-topbar-actions">
        <a class="ew-badge"
           th:if="${shellUser != null}"
           href="/account?tab=profile"
           aria-label="Account profile"
           th:text="${shellUser.displayName != null && !#strings.isEmpty(shellUser.displayName) ? shellUser.displayName : shellUser.email}">
            Account
        </a>
        <button class="ew-button secondary compact" type="button" data-logout-button>Sign out</button>
    </div>
</header>

<nav th:fragment="mobileNav" class="app-mobile-nav" aria-label="Mobile navigation">
    <a th:each="item : ${navItems}"
       th:href="@{${item.href}}"
       th:classappend="${item.href == '/' ? currentPath == '/' : #strings.startsWith(currentPath, item.href)} ? ' is-active'">
        <span th:text="${item.shortLabel}">D</span>
        <small th:text="${item.label}">Dashboard</small>
    </a>
</nav>
</body>
</html>
