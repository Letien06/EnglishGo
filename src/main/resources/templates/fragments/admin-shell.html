<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="app-sidebar admin-sidebar">
    <a class="app-brand" href="/admin">
        <span class="app-brand-mark">E</span>
        <span>
            <strong>ENGLISHGO</strong>
            <small>Admin Question Bank</small>
        </span>
    </a>

    <nav class="app-nav" aria-label="Admin navigation">
        <a href="/admin" class="app-nav-link" th:classappend="${currentPath == '/admin'} ? ' is-active'">
            <span class="app-nav-icon">T</span><span>Tổng quan</span>
        </a>
        <a href="/admin/question-bank" class="app-nav-link" th:classappend="${#strings.startsWith(currentPath, '/admin/question-bank')} ? ' is-active'">
            <span class="app-nav-icon">Q</span><span>Ngân hàng câu hỏi</span>
        </a>
        <a href="/admin/question-groups" class="app-nav-link" th:classappend="${#strings.startsWith(currentPath, '/admin/question-groups')} ? ' is-active'">
            <span class="app-nav-icon">G</span><span>Nhóm câu hỏi</span>
        </a>
        <a href="/admin/media" class="app-nav-link" th:classappend="${#strings.startsWith(currentPath, '/admin/media')} ? ' is-active'">
            <span class="app-nav-icon">M</span><span>Media</span>
        </a>
        <a href="/admin/ai-import" class="app-nav-link" th:classappend="${#strings.startsWith(currentPath, '/admin/ai-import')} ? ' is-active'">
            <span class="app-nav-icon">AI</span><span>AI & Import</span>
        </a>
        <a href="/admin/test-assembly" class="app-nav-link" th:classappend="${#strings.startsWith(currentPath, '/admin/test-assembly')} ? ' is-active'">
            <span class="app-nav-icon">T</span><span>Ghép đề thi</span>
        </a>
        <a href="/admin/question-bank?status=DRAFT" class="app-nav-link" th:classappend="${currentPath == '/admin/publish-review'} ? ' is-active'">
            <span class="app-nav-icon">P</span><span>Duyệt xuất bản</span>
        </a>
        <a href="/admin/users" class="app-nav-link" th:classappend="${#strings.startsWith(currentPath, '/admin/users')} ? ' is-active'">
            <span class="app-nav-icon">U</span><span>Người dùng</span>
        </a>
    </nav>

    <div class="admin-sidebar-actions">
        <a class="ew-button secondary compact" href="/">Về trang học</a>
        <button class="ew-button compact" type="button" data-logout-button>Đăng xuất</button>
    </div>
</aside>

<header th:fragment="topbar(pageTitle, pageSubtitle)" class="app-topbar admin-topbar">
    <div>
        <p class="app-eyebrow">ENGLISHGO Admin</p>
        <h1 th:text="${pageTitle}">Admin</h1>
        <p th:if="${pageSubtitle != null}" th:text="${pageSubtitle}">Quản lý nội dung học</p>
    </div>
    <div class="app-topbar-actions">
        <span class="ew-badge" th:if="${shellUser != null}" th:text="${shellUser.role}">ADMIN</span>
        <a class="ew-button secondary compact" href="/">Trang học</a>
    </div>
</header>
</body>
</html>
