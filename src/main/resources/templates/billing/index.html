<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Access</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v='app-shell-20260703-1')}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/shell :: topbar('Free access', 'All learning features are free for students')}"></div>
        <main class="app-content narrow">
            <section class="ew-card">
                <span class="ew-badge">FREE</span>
                <h2>No paid plans</h2>
                <p>This project is for learning, so practice tests, vocabulary, lessons, community, and AI-assisted study flows stay free.</p>
                <div class="button-row">
                    <a class="ew-button" href="/mock-test">Practice tests</a>
                    <a class="ew-button secondary" href="/vocab">Vocabulary</a>
                </div>
            </section>
            <section class="ew-alert" th:if="${message}" th:text="${message}">Message</section>
        </main>
    </div>
    <div th:replace="~{fragments/shell :: mobileNav}"></div>
</div>
<script th:src="@{/js/app-shell.js(v='app-shell-20260703-1')}"></script>
</body>
</html>
