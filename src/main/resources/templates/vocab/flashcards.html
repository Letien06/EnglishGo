<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${vocabSession.set.title} + ' - ENGLISHGO'">Vocabulary - ENGLISHGO</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="landing-body vocab-body" th:attr="data-set-id=${vocabSession.set.id}">
<header th:replace="~{fragments/public-header :: main('vocab')}"></header>

<main class="vocab-study-page vocab-game-page">
    <a class="vocab-back-link" th:href="${reviewMode} ? @{/vocab(tab='progress')} : @{/vocab/sets/{id}(id=${vocabSession.set.id})}">‹ Quay lại bộ từ</a>

    <section class="vocab-study-head">
        <span class="vocab-set-label" th:text="${vocabSession.set.topic}">TOEIC</span>
        <h1 th:text="${vocabSession.set.title}">Vocabulary set</h1>
        <p><strong id="wordTotal">0</strong> từ sẵn sàng. Chọn bộ lọc rồi vào game để luyện đúng nhóm từ cần học.</p>
    </section>

    <section class="mode-picker" hidden>Quiz</section>
    <section class="vocab-study-surface" id="vocabGame"></section>
</main>

<script th:inline="javascript">
    const seededWords = [[${vocabSession.words}]] || [];
    const initialMode = [[${mode}]];
    const setId = [[${vocabSession.set.id}]];
    const reviewMode = [[${reviewMode}]];
    const practiceSets = [[${practiceSets}]] || [];
    const selectedMastery = [[${selectedMastery}]] || "learning";
    const selectedOrder = [[${selectedOrder}]] || "random";
    const selectedAmount = [[${selectedAmount}]] || "20";
    document.getElementById("wordTotal").textContent = seededWords.length;

    const state = {
        words: seededWords,
        screen: initialMode && initialMode !== "menu" ? "play" : "hub",
        mode: initialMode && initialMode !== "menu" ? initialMode : "",
        quizMode: "wordMeaning",
        quizChooser: initialMode === "quiz",
        mixedMode: "flashcard",
        index: 0,
        flipped: false,
        reverse: false,
        muted: false,
        typed: "",
        hintRevealed: [],
        status: "",
        statusClass: "",
        score: 0,
        correct: 0,
        attempts: 0,
        selected: "",
        options: [],
        answers: [],
        feedback: null,
        saving: false,
        saveError: "",
        matchWords: [],
        matchMeanings: [],
        selectedMatchWord: "",
        selectedMatchMeaning: "",
        matchedIds: [],
        lives: 5,
        timer: 26,
        timerHandle: null,
        history: readHistory()
    };

    const app = document.getElementById("vocabGame");
    if (state.screen === "play") {
        prepare();
        if (["quiz", "matching"].includes(activeMode())) startTimer();
    }
    render();

    app.addEventListener("click", event => {
        const origin = event.target instanceof Element ? event.target : event.target.parentElement;
        const target = origin?.closest("[data-action]");
        if (!target) return;
        const action = target.dataset.action;
        const value = target.dataset.value;
        switch (action) {
            case "mode": startMode(value); break;
            case "quizChooser": state.quizChooser = true; render(); break;
            case "quizMode": startQuiz(value); break;
            case "closeQuiz": state.quizChooser = false; render(); break;
            case "flip": state.flipped = !state.flipped; renderPlay(); break;
            case "speakWord": speakWord(); break;
            case "speakExample": speakExample(); break;
            case "feedbackSpeak": speakItem(state.feedback?.item); break;
            case "feedbackExample": speakExampleFor(state.feedback?.item); break;
            case "resultSpeak": speakResult(value); break;
            case "checkTyped": checkTyped(); break;
            case "hintLetter": revealHintLetter(); break;
            case "known": markKnown(value === "true"); break;
            case "next": next(); break;
            case "continueFeedback": continueAfterFeedback(); break;
            case "saveComplete": saveAndComplete(); break;
            case "prev": previous(); break;
            case "hub": goHub(); break;
            case "restart": restart(); break;
            case "quizAnswer": checkQuiz(value); break;
            case "selectMatchWord": selectMatchWord(value); break;
            case "selectMatchMeaning": selectMatchMeaning(value); break;
            case "clearHistory": state.history = []; writeHistory(); render(); break;
            case "mute": state.muted = !state.muted; render(); break;
        }
    });

    app.addEventListener("change", event => {
        if (!event.target.matches("[data-practice-filter]")) return;
        const nextSetId = document.getElementById("practiceSetFilter")?.value || setId;
        const params = new URLSearchParams({
            mode: "menu",
            mastery: document.getElementById("practiceMasteryFilter")?.value || "learning",
            order: document.getElementById("practiceOrderFilter")?.value || "random",
            amount: document.getElementById("practiceAmountFilter")?.value || "20"
        });
        window.location.href = `/vocab/sets/${nextSetId}/flashcards?${params.toString()}`;
    });

    app.addEventListener("input", event => {
        if (event.target.id === "typedAnswer") state.typed = event.target.value;
        if (event.target.id === "directionToggle") {
            state.reverse = event.target.checked;
            renderPlay();
        }
    });

    app.addEventListener("submit", event => {
        event.preventDefault();
        checkTyped();
    });

    window.addEventListener("keydown", event => {
        if (state.screen !== "play") return;
        const typingTarget = isEditableTarget(event.target);
        if (typingTarget && !(event.ctrlKey || event.metaKey)) return;
        if ((event.ctrlKey || event.metaKey) && event.code === "Space" && ["typing", "listening"].includes(activeMode())) {
            event.preventDefault();
            revealHintLetter();
            return;
        }
        if (state.feedback) {
            if (event.key === "Enter" || event.key === "ArrowRight" || event.code === "Space") {
                event.preventDefault();
                continueAfterFeedback();
            }
            return;
        }
        if (event.code === "Space" && ["flashcard", "typing", "listening"].includes(activeMode())) {
            event.preventDefault();
            if (activeMode() === "listening") speakWord();
            else {
                state.flipped = !state.flipped;
                renderPlay();
            }
        }
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "x") {
            event.preventDefault();
            speakWord();
        }
        if (activeMode() === "quiz" && ["1", "2", "3", "4"].includes(event.key)) {
            const option = state.options[Number(event.key) - 1];
            if (option) checkQuiz(option);
        }
        if (event.key === "ArrowRight") next();
        if (event.key === "ArrowLeft") previous();
    });

    function render() {
        app.innerHTML = state.screen === "hub" ? hubHtml() : state.screen === "result" ? resultHtml() : playHtml();
    }

    function renderPlay() {
        app.innerHTML = playHtml();
    }

    function hubHtml() {
        return `
            ${filtersHtml()}
            <div class="vocab-game-topline">
                <h2>Chọn game:</h2>
                <button type="button" title="Cài đặt">⚙</button>
                <div>
                    <button type="button" data-action="mute">${state.muted ? "Bật tiếng" : "Tắt tiếng"}</button>
                    <span><b>${state.words.length}</b> từ sẵn sàng</span>
                </div>
            </div>
            <section class="mode-picker vocab-game-picker" aria-label="Chọn chế độ học">
                ${modeCard("flashcard", "☷", "Flashcard", "Lật thẻ học từ vựng", "+5", "mode")}
                ${modeCard("quiz", "☑", "Trắc nghiệm", "Chọn đáp án đúng", "+10", "quizChooser")}
                ${modeCard("matching", "▦", "Nối từ với nghĩa", "Ghép đôi từ vựng và nghĩa", "+10", "mode")}
                ${modeCard("typing", "T", "Gõ từ vựng", "Nhìn nghĩa và gõ tiếng Anh", "+10", "mode")}
                ${modeCard("listening", "♫", "Nghe viết", "Nghe phát âm và viết từ", "+15", "mode")}
                ${modeCard("mixed", "↗", "Tổng hợp", "Trộn flashcard, quiz, gõ và nghe", "+20", "mode", true)}
            </section>
            <section class="vocab-srs-banner">
                <div><strong>Ôn tập ngắt quãng (SRS)</strong><span>Hệ thống tự động nhắc lại các từ bạn sắp quên. Học ít, nhớ lâu.</span></div>
                <button type="button" data-action="mode" data-value="flashcard">Bắt đầu ôn tập</button>
            </section>
            <section class="vocab-game-history">
                <header><h2>Lịch sử đấu</h2><button type="button" data-action="clearHistory">Xóa lịch sử</button></header>
                ${state.history.length ? state.history.map(historyItem).join("") : "<p>Chưa có lượt học nào trong trình duyệt này.</p>"}
            </section>
            ${state.quizChooser ? quizChooserHtml() : ""}
        `;
    }

    function filtersHtml() {
        const setOptions = practiceSets.map(item => `<option value="${item.id}" ${Number(item.id) === Number(setId) ? "selected" : ""}>${escapeHtml(item.title)}</option>`).join("");
        return `<section class="vocab-practice-filters">
            <label><span>Bộ từ vựng</span><select id="practiceSetFilter" data-practice-filter>${setOptions}</select></label>
            <label><span>Bộ lọc</span><select id="practiceMasteryFilter" data-practice-filter>
                <option value="learning" ${selectedMastery === "learning" ? "selected" : ""}>Chưa thuộc</option>
                <option value="mastered" ${selectedMastery === "mastered" ? "selected" : ""}>Đã thuộc</option>
                <option value="due" ${selectedMastery === "due" ? "selected" : ""}>Cần ôn lại</option>
                <option value="all" ${selectedMastery === "all" ? "selected" : ""}>Tất cả</option>
            </select></label>
            <label><span>Thứ tự</span><select id="practiceOrderFilter" data-practice-filter>
                <option value="random" ${selectedOrder === "random" ? "selected" : ""}>Ngẫu nhiên</option>
                <option value="ordered" ${selectedOrder === "ordered" ? "selected" : ""}>Theo thứ tự</option>
            </select></label>
            <label><span>Số lượng</span><select id="practiceAmountFilter" data-practice-filter>
                <option value="20" ${selectedAmount === "20" ? "selected" : ""}>20 từ</option>
                <option value="50" ${selectedAmount === "50" ? "selected" : ""}>50 từ</option>
                <option value="all" ${selectedAmount === "all" ? "selected" : ""}>Tất cả</option>
            </select></label>
        </section>`;
    }

    function modeCard(value, icon, title, desc, points, action, hot = false) {
        const css = value === "quiz" ? "quiz" : value;
        return `<button class="mode-card ${css}" type="button" data-action="${action}" data-value="${value}">
            ${hot ? "<em>HOT</em>" : ""}<span>${icon}</span><strong>${title}</strong><small>${desc}</small><b>${points}</b>
        </button>`;
    }

    function historyItem(item) {
        return `<article><div><strong>${escapeHtml(item.mode)}</strong><span>${escapeHtml(item.time)}</span></div>
            <div><small>Độ chính xác</small><b>${item.accuracy}%</b></div>
            <div><small>Điểm</small><b>+${item.score}</b></div></article>`;
    }

    function playHtml() {
        if (!state.words.length) {
            return `<section class="vocab-empty-panel"><span>▥</span><h2>Không có từ phù hợp bộ lọc</h2><p>Đổi bộ lọc sang tất cả hoặc thêm từ vào bộ này.</p></section>`;
        }
        const mode = activeMode();
        const body = mode === "quiz" ? quizHtml()
            : mode === "matching" ? matchingHtml()
            : mode === "typing" ? typingHtml()
            : mode === "listening" ? listeningHtml()
            : flashHtml();
        return `
            <article>
                <section class="game-play-header">
                    <div><span class="coin-pill">~<b>${state.score}</b> GAME</span><strong>${headerProgress()}</strong></div>
                    ${mode === "flashcard" || mode === "typing" ? directionToggle() : ""}
                    <button type="button" data-action="restart">↻ Chơi lại</button>
                    <a class="game-header-link" href="${reviewMode ? "/vocab" : "/vocab/sets/" + setId + "/flashcards?mode=menu"}">Thoát</a>
                    <div class="game-progress"><span style="width:${progressPercent()}%"></span></div>
                    <div class="game-progress game-time"><span style="width:${(state.timer / 30) * 100}%"></span></div>
                </section>
                ${body}
            </article>
            ${feedbackHtml()}
            ${state.quizChooser ? quizChooserHtml() : ""}
        `;
    }

    function activeMode() {
        return state.mode === "mixed" ? state.mixedMode : state.mode;
    }

    function headerProgress() {
        if (activeMode() === "matching") return `Đã ghép ${state.matchedIds.length} / ${state.matchWords.length}`;
        return `Câu ${state.index + 1} / ${state.words.length}`;
    }

    function directionToggle() {
        return `<label class="direction-toggle"><span>${state.reverse ? "VN→EN" : "EN→VN"}</span>
            <input id="directionToggle" type="checkbox" ${state.reverse ? "checked" : ""}><i></i></label>`;
    }

    function flashHtml() {
        const current = word();
        const frontTitle = state.reverse ? "NGHĨA TIẾNG VIỆT" : "TỪ TIẾNG ANH";
        const frontMain = state.reverse ? current.meaning : current.word;
        const backTitle = state.reverse ? "TỪ TIẾNG ANH" : "NGHĨA TIẾNG VIỆT";
        const backMain = state.reverse ? current.word : current.meaning;
        return `<section>
            <div class="study-card game-flashcard ${state.flipped ? "is-flipped" : ""} ${state.reverse ? "is-reverse" : ""}" data-action="flip">
                <div class="game-card-face front">
                    <small>${frontTitle}</small><strong>${escapeHtml(frontMain)}</strong>
                    <span class="vocab-pos">${escapeHtml(current.partOfSpeech || "OTHER")}</span>
                    ${!state.reverse && current.phonetic ? `<em>${escapeHtml(current.phonetic)}</em>` : ""}
                    <button class="card-audio" type="button" data-action="speakWord">♫ Nghe từ</button><p>Nhấn Space hoặc click để lật</p>
                </div>
                <div class="game-card-face back">
                    <small>${backTitle}</small><strong>${escapeHtml(backMain)}</strong>
                    <span class="vocab-pos">${escapeHtml(current.partOfSpeech || "OTHER")}</span>
                    ${current.example ? `<em>Ví dụ: ${escapeHtml(current.example)}</em>` : ""}
                    <button class="card-audio" type="button" data-action="speakExample">♫ Nghe câu ví dụ</button><p>Nhấn Space hoặc click để lật lại</p>
                </div>
            </div>
            <form class="flash-answer-row"><input id="typedAnswer" value="${escapeHtml(state.typed)}" placeholder="${answerPlaceholder()}"><button type="submit">Check</button></form>
            <p class="study-status ${state.statusClass}">${escapeHtml(state.status)}</p>
            ${commonActions()}
        </section>`;
    }

    function typingHtml() {
        const current = word();
        return `<section class="typing-play-card">
            <h2>${escapeHtml(typingPrompt())}</h2>
            <div><button class="inline-sound" type="button" data-action="speakWord">♫</button><span class="vocab-pos">${escapeHtml(current.partOfSpeech || "OTHER")}</span></div>
            <em>${state.flipped && current.example ? escapeHtml(current.example) : "Chưa có gợi ý"}</em>
            ${hintHtml()}
            <form class="typing-answer-row"><input id="typedAnswer" value="${escapeHtml(state.typed)}" placeholder="${answerPlaceholder()}"><button type="submit">Kiểm tra</button></form>
            <div class="typing-tools">
                <button type="button" data-action="flip">Xem ví dụ</button>
                <button type="button" data-action="hintLetter" ${remainingHints() <= 0 ? "disabled" : ""}>Gợi ý (${remainingHints()})</button>
            </div>
            <p class="study-status ${state.statusClass}">${escapeHtml(state.status)}</p>
        </section>`;
    }

    function listeningHtml() {
        const current = word();
        return `<section class="typing-play-card listening-play-card">
            <small>Nghe: 2x | Ctrl+H</small>
            <button class="listening-main-button" type="button" data-action="speakWord">♫<b>CTRL + X</b></button>
            <h2>Nghe và gõ từ tiếng Anh</h2>
            <span class="vocab-pos">${escapeHtml(current.partOfSpeech || "OTHER")}</span>
            <em>${state.flipped && current.example ? escapeHtml(current.example) : "Chưa có gợi ý"}</em>
            ${hintHtml()}
            <form class="typing-answer-row"><input id="typedAnswer" value="${escapeHtml(state.typed)}" placeholder="Gõ từ bạn nghe được..."><button type="submit">Kiểm tra</button></form>
            <div class="typing-tools">
                <button type="button" data-action="flip">Xem ví dụ</button>
                <button type="button" data-action="hintLetter" ${remainingHints() <= 0 ? "disabled" : ""}>Gợi ý (${remainingHints()})</button>
            </div>
            <p class="study-status ${state.statusClass}">${escapeHtml(state.status)}</p>
        </section>`;
    }

    function quizHtml() {
        const current = word();
        let question;
        if (state.quizMode === "context") {
            question = `<section class="context-question"><span>NGỮ CẢNH · CHỌN ĐÁP ÁN</span><p>${escapeHtml(contextSentence())}</p><button type="button" data-action="speakExample">Dịch câu / nghe</button></section>`;
        } else if (state.quizMode === "meaningWord") {
            question = `<section><h2>${escapeHtml(current.meaning)}</h2><button class="inline-sound" type="button" data-action="speakWord">♫</button></section>`;
        } else {
            question = `<section><h2>${escapeHtml(current.word)}</h2><button class="inline-sound" type="button" data-action="speakWord">♫</button><span class="vocab-pos">${escapeHtml(current.partOfSpeech || "OTHER")}</span>${current.phonetic ? `<em>${escapeHtml(current.phonetic)}</em>` : ""}</section>`;
        }
        return `<section class="quiz-play-card">
            <header><strong>Câu ${state.index + 1} / ${state.words.length}</strong><div><span class="coin-pill">~<b>${state.score}</b> GAME</span><span class="timer-pill">${state.timer}s</span></div></header>
            ${question}
            <div class="quiz-options game-quiz-options">${state.options.map((option, i) => quizOption(option, i)).join("")}</div>
            <p>Sử dụng phím số 1-4 để chọn nhanh đáp án</p>
            <p class="study-status ${state.statusClass}">${escapeHtml(state.status)}</p>
        </section>`;
    }

    function quizOption(option, i) {
        return `<button type="button" class="${optionClass(option)}" data-action="quizAnswer" data-value="${escapeHtml(option)}"><span>${i + 1}</span><b>${escapeHtml(option)}</b></button>`;
    }

    function matchingHtml() {
        return `<section class="matching-board">
            <header class="matching-health"><div>${"❤ ".repeat(Math.max(0, state.lives)).trim()}</div><span class="timer-pill">${state.timer}s</span></header>
            <div class="matching-columns">
                <section><h2>Tiếng Anh</h2>${state.matchWords.map(item => matchWordButton(item)).join("")}</section>
                <section><h2>Tiếng Việt</h2>${state.matchMeanings.map(item => matchMeaningButton(item)).join("")}</section>
            </div>
            <strong>Đã ghép: ${state.matchedIds.length} / ${state.matchWords.length}</strong>
            <p class="study-status ${state.statusClass}">${escapeHtml(state.status)}</p>
        </section>`;
    }

    function matchWordButton(item) {
        const done = state.matchedIds.includes(item.id);
        const selected = String(state.selectedMatchWord) === String(item.id);
        return `<button type="button" data-action="selectMatchWord" data-value="${item.id}" class="${done ? "is-matched" : ""} ${selected ? "is-selected" : ""}" ${done ? "disabled" : ""}>${escapeHtml(item.word)}</button>`;
    }

    function matchMeaningButton(item) {
        const done = state.matchedIds.includes(item.id);
        const selected = String(state.selectedMatchMeaning) === String(item.id);
        return `<button type="button" data-action="selectMatchMeaning" data-value="${item.id}" class="${done ? "is-matched" : ""} ${selected ? "is-selected" : ""}" ${done ? "disabled" : ""}>${escapeHtml(item.meaning)}</button>`;
    }

    function quizChooserHtml() {
        return `<section class="quiz-mode-modal">
            <div data-action="closeQuiz"></div>
            <article>
                <button type="button" data-action="closeQuiz">×</button>
                <h2>Chọn chế độ Quiz</h2>
                <button type="button" class="blue" data-action="quizMode" data-value="wordMeaning"><strong>Từ -> Nghĩa</strong><span>Nhìn từ tiếng Anh, chọn nghĩa đúng</span></button>
                <button type="button" class="purple" data-action="quizMode" data-value="context"><strong>Ngữ cảnh</strong><span>Che từ trong ví dụ, chọn đáp án phù hợp với câu</span></button>
                <button type="button" class="green" data-action="quizMode" data-value="meaningWord"><strong>Nghĩa -> Từ</strong><span>Nhìn nghĩa tiếng Việt, chọn từ đúng</span></button>
            </article>
        </section>`;
    }

    function commonActions() {
        return `<div class="study-actions game-actions">
            <button type="button" class="flash-nav-action" data-action="prev">‹ Trước</button>
            <button type="button" class="sound-round flash-sound-action" data-action="speakWord">♫</button>
            <button type="button" class="flash-choice-action forget" data-action="known" data-value="false">× Quên</button>
            <button type="button" class="flash-choice-action known" data-action="known" data-value="true">✓ Thuộc</button>
            <button type="button" class="flash-nav-action next" data-action="next">Tiếp ›</button>
        </div>`;
    }

    function startMode(mode) {
        state.mode = mode;
        if (mode === "typing") state.reverse = true;
        state.quizChooser = false;
        state.screen = "play";
        reset();
        prepare();
        if (["quiz", "matching"].includes(activeMode())) startTimer();
        render();
        if (activeMode() === "listening") setTimeout(speakWord, 250);
    }

    function startQuiz(mode) {
        state.mode = "quiz";
        state.quizMode = mode;
        state.quizChooser = false;
        state.screen = "play";
        reset();
        prepare();
        startTimer();
        render();
    }

    function reset() {
        state.index = 0; state.flipped = false; state.typed = ""; state.hintRevealed = []; state.status = ""; state.statusClass = "";
        state.score = 0; state.correct = 0; state.attempts = 0; state.selected = "";
        state.answers = []; state.feedback = null; state.saving = false; state.saveError = "";
        state.matchWords = []; state.matchMeanings = []; state.selectedMatchWord = ""; state.selectedMatchMeaning = ""; state.matchedIds = []; state.lives = 5;
        stopTimer();
    }

    function restart() { reset(); prepare(); if (["quiz", "matching"].includes(activeMode())) startTimer(); render(); }
    function word() { return state.words[state.index] || {}; }
    function progressPercent() {
        if (activeMode() === "matching") return state.matchWords.length ? (state.matchedIds.length / state.matchWords.length) * 100 : 0;
        return state.words.length ? ((state.index + 1) / state.words.length) * 100 : 0;
    }

    function prepare() {
        state.flipped = false; state.typed = ""; state.hintRevealed = []; state.status = ""; state.statusClass = ""; state.selected = ""; state.feedback = null;
        if (state.mode === "mixed") state.mixedMode = ["flashcard", "quiz", "typing", "listening"][state.index % 4];
        if (state.mode === "mixed" && activeMode() === "typing") state.reverse = true;
        if (activeMode() === "quiz") state.options = quizOptions();
        if (activeMode() === "matching" && state.matchWords.length === 0) prepareMatching();
    }

    function next() {
        state.feedback = null;
        if (state.index >= state.words.length - 1) { showResult(); return; }
        state.index += 1; prepare(); if (["quiz", "matching"].includes(activeMode())) startTimer(); render();
        if (activeMode() === "listening") setTimeout(speakWord, 250);
    }

    function previous() { state.index = Math.max(0, state.index - 1); prepare(); render(); }
    function goHub() {
        try { finishGame(); } catch (error) {}
        state.screen = "hub";
        stopTimer();
        render();
    }

    function answerPlaceholder() {
        if (activeMode() === "listening") return "Gõ từ bạn nghe được...";
        return state.reverse ? "Gõ từ tiếng Anh..." : "Gõ nghĩa tiếng Việt...";
    }

    function expectedAnswer() {
        if (activeMode() === "typing") return state.reverse ? word().word : word().meaning;
        return state.reverse || activeMode() === "listening" ? word().word : word().meaning;
    }

    function typingPrompt() {
        const current = word();
        return state.reverse ? current.meaning : current.word;
    }

    function hintAnswer() {
        return String(expectedAnswer() || "");
    }

    function hintableIndexes() {
        return [...hintAnswer()]
                .map((char, index) => ({char, index}))
                .filter(item => /[\p{L}\p{N}]/u.test(item.char))
                .map(item => item.index);
    }

    function maxHints() {
        return Math.min(3, hintableIndexes().length);
    }

    function remainingHints() {
        return Math.max(0, maxHints() - state.hintRevealed.length);
    }

    function revealHintLetter() {
        if (!["typing", "listening"].includes(activeMode()) || state.feedback) return;
        const available = hintableIndexes().filter(index => !state.hintRevealed.includes(index));
        if (!available.length || remainingHints() <= 0) return;
        const nextIndex = available[Math.floor(Math.random() * available.length)];
        state.hintRevealed = [...state.hintRevealed, nextIndex].sort((a, b) => a - b);
        renderPlay();
    }

    function hintHtml() {
        const answer = hintAnswer();
        if (!answer) return "";
        const letters = [...answer].map((char, index) => {
            if (/\s/u.test(char)) return "<span class=\"is-gap\"></span>";
            if (!/[\p{L}\p{N}]/u.test(char)) return `<span class="is-mark">${escapeHtml(char)}</span>`;
            const visible = state.hintRevealed.includes(index);
            return `<span class="${visible ? "is-visible" : ""}">${visible ? escapeHtml(char) : ""}</span>`;
        }).join("");
        return `<div class="typing-letter-hint" aria-label="Gợi ý chữ cái">${letters}</div>`;
    }

    function checkTyped() {
        if (state.feedback) return;
        const expected = expectedAnswer();
        const ok = answerMatches(state.typed, expected);
        state.attempts += 1;
        if (ok) { state.correct += 1; state.score += activeMode() === "listening" ? 15 : 10; state.status = "Đúng rồi."; state.statusClass = "is-correct"; state.flipped = true; }
        else { state.status = `Sai rồi. Đáp án đúng: ${expected}`; state.statusClass = "is-wrong"; }
        addAnswer(word(), ok, state.typed, expected);
        showFeedback(ok, state.typed, expected);
        renderPlay();
    }

    function answerMatches(input, expected) {
        const actual = normalize(input), target = normalize(expected);
        return !!actual && (actual === target || (!state.reverse && target.includes(actual) && actual.length >= 3));
    }

    function markKnown(known) {
        if (state.feedback) return;
        state.attempts += 1;
        if (known) { state.correct += 1; state.score += 5; state.status = "Đã đánh dấu thuộc."; state.statusClass = "is-correct"; }
        else { state.status = "Đã đánh dấu cần ôn lại."; state.statusClass = "is-wrong"; }
        addAnswer(word(), known, known ? "Đã thuộc" : "Quên", word().meaning);
        showFeedback(known, known ? "Đã thuộc" : "Quên", word().meaning);
        renderPlay();
    }

    async function review(quality) {
        try {
            await fetch(`/api/vocab/words/${word().id}/review`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({quality})});
        } catch (error) {}
    }

    function quizOptions() {
        const correct = quizCorrectAnswer();
        const pool = state.words.map(quizValueForOption).filter(Boolean).filter(value => value !== correct);
        return shuffle([correct, ...shuffle(pool).slice(0, 3)]).slice(0, 4);
    }

    function quizCorrectAnswer() { return state.quizMode === "wordMeaning" ? word().meaning : word().word; }
    function quizValueForOption(item) { return state.quizMode === "wordMeaning" ? item.meaning : item.word; }

    function checkQuiz(option) {
        if (state.selected || state.feedback) return;
        state.selected = option; state.attempts += 1;
        if (option === quizCorrectAnswer()) { state.correct += 1; state.score += state.quizMode === "context" ? 12 : 10; state.status = "Đúng rồi."; state.statusClass = "is-correct"; }
        else { state.status = `Sai rồi. Đáp án đúng: ${quizCorrectAnswer()}`; state.statusClass = "is-wrong"; }
        addAnswer(word(), option === quizCorrectAnswer(), option, quizCorrectAnswer());
        showFeedback(option === quizCorrectAnswer(), option, quizCorrectAnswer());
        renderPlay();
    }

    function optionClass(option) {
        if (!state.selected) return "";
        if (option === quizCorrectAnswer()) return "is-correct";
        if (option === state.selected) return "is-wrong";
        return "";
    }

    function contextSentence() {
        const example = word().example || `We verified the ${word().word} before publishing.`;
        return example.replace(new RegExp(word().word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig"), "____");
    }

    function prepareMatching() {
        state.matchWords = shuffle(state.words).slice(0, Math.min(8, state.words.length));
        state.matchMeanings = shuffle(state.matchWords);
        state.matchedIds = [];
        state.lives = 5;
    }

    function selectMatchWord(id) {
        if (state.matchedIds.includes(Number(id))) return;
        state.selectedMatchWord = id;
        resolveMatch();
    }

    function selectMatchMeaning(id) {
        if (state.matchedIds.includes(Number(id))) return;
        state.selectedMatchMeaning = id;
        resolveMatch();
    }

    function resolveMatch() {
        if (!state.selectedMatchWord || !state.selectedMatchMeaning) { renderPlay(); return; }
        if (String(state.selectedMatchWord) === String(state.selectedMatchMeaning)) {
            state.correct += 1;
            state.score += 10;
            state.matchedIds = [...state.matchedIds, Number(state.selectedMatchWord)];
            state.status = "Ghép đúng.";
            state.statusClass = "is-correct";
            const matched = state.matchWords.find(item => String(item.id) === String(state.selectedMatchWord));
            if (matched) {
                state.attempts += 1;
                addAnswer(matched, true, matched.word, matched.meaning);
                showFeedback(true, matched.word, matched.meaning, matched);
            }
            if (state.matchedIds.length === state.matchWords.length) {
                stopTimer();
                state.status = "Hoàn thành bài nối từ.";
            }
        } else {
            const selected = state.matchWords.find(item => String(item.id) === String(state.selectedMatchWord));
            const chosen = state.matchMeanings.find(item => String(item.id) === String(state.selectedMatchMeaning));
            if (selected) {
                state.attempts += 1;
                addAnswer(selected, false, chosen?.meaning || "", selected.meaning);
                showFeedback(false, chosen?.meaning || "", selected.meaning, selected);
            }
            state.lives = Math.max(0, state.lives - 1);
            state.status = "Chưa khớp, thử lại.";
            state.statusClass = "is-wrong";
            if (state.lives <= 0) {
                stopTimer();
            }
        }
        state.selectedMatchWord = "";
        state.selectedMatchMeaning = "";
        renderPlay();
    }

    function startTimer() {
        stopTimer(); state.timer = 30;
        state.timerHandle = setInterval(() => {
            state.timer -= 1;
            if (state.timer <= 0) {
                state.attempts += 1;
                state.selected = "__timeout__";
                state.status = activeMode() === "matching" ? "Hết giờ." : `Hết giờ. Đáp án đúng: ${quizCorrectAnswer()}`;
                state.statusClass = "is-wrong";
                stopTimer();
                if (activeMode() === "matching") {
                    state.matchWords
                            .filter(item => !state.matchedIds.includes(item.id))
                            .forEach(item => addAnswer(item, false, "Hết giờ", item.meaning));
                    showResult();
                    return;
                }
                addAnswer(word(), false, "Hết giờ", quizCorrectAnswer());
                showFeedback(false, "Hết giờ", quizCorrectAnswer());
                renderPlay();
            } else renderPlay();
        }, 1000);
    }

    function stopTimer() { if (state.timerHandle) clearInterval(state.timerHandle); state.timerHandle = null; }

    function addAnswer(item, correct, selected, expected) {
        state.answers.push({
            id: item.id,
            word: item.word,
            meaning: item.meaning,
            partOfSpeech: item.partOfSpeech,
            phonetic: item.phonetic,
            example: item.example,
            audioUrl: item.audioUrl,
            correct: correct,
            selected: selected,
            expected: expected,
            mode: modeLabel()
        });
    }

    function showFeedback(correct, selected, expected, item = word()) {
        state.feedback = {
            correct: correct,
            selected: selected,
            expected: expected,
            item: item,
            canContinue: true
        };
        stopTimer();
    }

    function feedbackHtml() {
        if (!state.feedback) return "";
        const item = state.feedback.item || {};
        const css = state.feedback.correct ? "is-correct" : "is-wrong";
        const label = state.feedback.correct ? "Đúng rồi" : "Sai rồi";
        const continueText = activeMode() === "matching" && (state.matchedIds.length === state.matchWords.length || state.lives <= 0)
            ? "Xem kết quả"
            : "Tiếp tục";
        const phoneticLine = item.phonetic ? "<p>//" + escapeHtml(item.phonetic.replace(/^\/+|\/+$/g, "")) + "//</p>" : "";
        const exampleLine = item.example ? "<em>Ví dụ: " + escapeHtml(item.example) + "</em>" : "";
        return `<section class="answer-feedback ${css}">
            <div class="answer-feedback-inner">
                <button class="answer-sound" type="button" data-action="feedbackSpeak">♫</button>
                <div>
                    <span>${label}</span>
                    <h2>Từ: ${escapeHtml(item.word || "")} <small>(${escapeHtml(item.partOfSpeech || "other")})</small></h2>
                    ${phoneticLine}
                    <strong>Nghĩa: ${escapeHtml(item.meaning || state.feedback.expected || "")}</strong>
                    ${exampleLine}
                </div>
                <div class="answer-feedback-actions">
                    <button type="button" data-action="feedbackExample">Ⅱ</button>
                    <button type="button" class="answer-mark" title="${state.feedback.correct ? "Đánh dấu sai" : "Đánh dấu là đúng"}">${state.feedback.correct ? "×" : "✓"}</button>
                    <button type="button" class="answer-continue" data-action="continueFeedback">${continueText}</button>
                </div>
            </div>
        </section>`;
    }

    function continueAfterFeedback() {
        if (activeMode() === "matching") {
            const done = state.matchedIds.length === state.matchWords.length || state.lives <= 0;
            state.feedback = null;
            if (done) showResult();
            else {
                startTimer();
                renderPlay();
            }
            return;
        }
        next();
    }

    function showResult() {
        stopTimer();
        state.feedback = null;
        state.screen = "result";
        render();
    }

    function resultHtml() {
        const total = Math.max(1, state.answers.length || state.attempts);
        const correctItems = state.answers.filter(item => item.correct);
        const wrongItems = state.answers.filter(item => !item.correct);
        const percent = Math.round((correctItems.length / total) * 100);
        const title = percent >= 80 ? "Tốt lắm!" : percent >= 50 ? "Khá ổn!" : "Cố gắng!";
        const saveErrorLine = state.saveError ? "<p class=\"save-error-message\">" + escapeHtml(state.saveError) + "</p>" : "";
        return `<section class="game-result-screen">
            <article class="game-result-summary">
                <div class="result-percent">${percent}%</div>
                <div><h2>💪 ${title}</h2><p>✓ ${correctItems.length} đúng &nbsp; X ${wrongItems.length} sai &nbsp; 🎯 ${state.score} điểm</p></div>
                <aside><strong>🪙 Dự kiến</strong><p>Số dư coin nếu lưu ngay</p><b>~ +${state.score}</b></aside>
            </article>
            <div class="game-result-columns">
                ${resultColumn("correct", "✓", `Trả lời đúng (${correctItems.length})`, "Chọn từ đánh dấu \"Đã thuộc\"", correctItems)}
                ${resultColumn("wrong", "×", `Trả lời sai (${wrongItems.length})`, "Cần ôn lại", wrongItems)}
            </div>
            <button class="save-complete-button" type="button" data-action="saveComplete">${state.saving ? "Đang lưu..." : "✓ 💾 Lưu & Hoàn thành"}</button>
            ${saveErrorLine}
        </section>`;
    }

    function resultColumn(type, icon, title, subtitle, items) {
        return `<section class="result-column ${type}">
            <header><span>${icon}</span><div><h3>${title}</h3><p>${subtitle}</p></div>${type === "correct" ? "<button type=\"button\">✓ Tất cả</button>" : ""}</header>
            <div class="result-table">
                <div class="result-table-head"><b>TỪ VỰNG</b><b>NGHĨA</b></div>
                ${items.length ? items.map(resultRow).join("") : "<p class=\"result-empty\">Không có từ nào.</p>"}
            </div>
        </section>`;
    }

    function resultRow(item) {
        return `<article>
            <span>${item.correct ? "✓" : "×"}</span>
            <strong>${escapeHtml(item.word || "")}</strong>
            <button type="button" data-action="resultSpeak" data-value="${item.id}">♫</button>
            <p>${escapeHtml(item.meaning || item.expected || "")}</p>
        </article>`;
    }

    async function saveAndComplete() {
        if (state.saving) return;
        state.saving = true;
        state.saveError = "";
        render();
        const failures = [];
        try {
            const latestAnswers = [...new Map(state.answers
                    .filter(item => item && item.id)
                    .map(item => [item.id, item])).values()];
            await Promise.all(latestAnswers.map(async item => {
                const response = await fetch(`/api/vocab/words/${item.id}/review`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({quality: item.correct ? 5 : 2})
                });
                if (!response.ok) failures.push(response.status);
            }));
        } catch (error) {
            state.saving = false;
            state.saveError = "Chưa lưu được kết quả. Vui lòng thử lại.";
            render();
            return;
        }
        if (failures.length) {
            state.saving = false;
            state.saveError = failures.includes(401)
                ? "Bạn cần đăng nhập để lưu tiến độ học."
                : "Chưa lưu được kết quả. Vui lòng thử lại.";
            render();
            return;
        }
        finishGame();
        reset();
        state.screen = "hub";
        render();
    }

    function finishGame() {
        const answered = state.answers.length || state.attempts;
        if (!answered && !state.score) return;
        const correctCount = state.answers.length ? state.answers.filter(item => item.correct).length : state.correct;
        const accuracy = answered ? Math.round((correctCount / answered) * 100) : 0;
        state.history = [{id: Date.now(), mode: modeLabel(), time: new Date().toLocaleString("vi-VN", {day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit"}), accuracy, score: state.score}, ...state.history].slice(0, 8);
        writeHistory(); state.attempts = 0; state.correct = 0; state.score = 0;
    }

    function modeLabel() {
        if (state.mode === "mixed") return "Tổng hợp";
        if (state.mode === "quiz") return state.quizMode === "context" ? "Quiz ngữ cảnh" : state.quizMode === "meaningWord" ? "Quiz nghĩa -> từ" : "Quiz từ -> nghĩa";
        return {flashcard: "Flashcard", typing: "Gõ từ vựng", listening: "Nghe viết", matching: "Nối từ với nghĩa"}[state.mode] || "Tổng hợp";
    }

    function speakWord() {
        speakItem(word());
    }

    function speakItem(item) {
        if (state.muted || !item) return;
        if (item.audioUrl) { new Audio(item.audioUrl).play(); return; }
        speak(item.word);
    }

    function speakExample() { speakExampleFor(word()); }
    function speakExampleFor(item) { if (!state.muted && item?.example) speak(item.example); }
    function speakResult(id) {
        const item = state.answers.find(answer => String(answer.id) === String(id)) || state.words.find(entry => String(entry.id) === String(id));
        speakItem(item);
    }
    function speak(text) { if ("speechSynthesis" in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; speechSynthesis.speak(u); } }

    function isEditableTarget(target) {
        return target instanceof HTMLInputElement
            || target instanceof HTMLTextAreaElement
            || target?.isContentEditable;
    }

    function normalize(value) { return String(value || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim(); }
    function shuffle(items) { return [...items].sort(() => Math.random() - 0.5); }
    function escapeHtml(value) { return String(value || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;"); }

    function readHistory() { try { return JSON.parse(localStorage.getItem(storageKey()) || "[]"); } catch (error) { return []; } }
    function writeHistory() { try { localStorage.setItem(storageKey(), JSON.stringify(state.history.slice(0, 8))); } catch (error) {} }
    function storageKey() { return `englishgo-vocab-history-${setId}`; }
</script>
</body>
</html>
