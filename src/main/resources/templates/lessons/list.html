<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lessons</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/shell :: topbar('Lessons', 'Short reading notes for TOEIC skills')}"></div>
        <main class="app-content">
            <form class="toolbar ew-card" method="get" action="/lessons">
                <label class="form-field">Topic
                    <input name="topic" th:value="${topic}" placeholder="Listening, grammar, reading">
                </label>
                <button type="submit">Filter</button>
                <a class="ew-button secondary" href="/lessons">Clear</a>
            </form>

            <section class="ew-empty" th:if="${lessons.empty}">
                No lessons found.
            </section>

            <section class="card-grid" th:unless="${lessons.empty}">
                <article class="ew-card" th:each="lesson : ${lessons.content}">
                    <span class="ew-badge" th:text="${lesson.topic}">Topic</span>
                    <h2><a th:href="@{/lessons/{id}(id=${lesson.id})}" th:text="${lesson.title}">Lesson</a></h2>
                </article>
            </section>
        </main>
    </div>
    <div th:replace="~{fragments/shell :: mobileNav}"></div>
</div>
<script th:src="@{/js/app-shell.js}"></script>
</body>
</html>
