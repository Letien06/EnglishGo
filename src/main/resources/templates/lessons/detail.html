<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${lesson.title}">Lesson</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/shell :: topbar(${lesson.title}, ${lesson.topic})}"></div>
        <main class="app-content narrow">
            <article class="ew-card">
                <p class="lesson-content" th:text="${lesson.content}">Content</p>
                <a class="ew-button" th:if="${lesson.videoUrl != null}" th:href="${lesson.videoUrl}">Open video</a>
            </article>
        </main>
    </div>
    <div th:replace="~{fragments/shell :: mobileNav}"></div>
</div>
<script th:src="@{/js/app-shell.js}"></script>
</body>
</html>
