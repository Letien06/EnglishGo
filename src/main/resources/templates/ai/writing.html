<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Writing</title>
    <style>
        body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f5f7fb; color: #172033; }
        header { display: flex; justify-content: space-between; padding: 18px 28px; background: #fff; border-bottom: 1px solid #d9e1ec; }
        main { width: min(94vw, 900px); margin: 32px auto; }
        a { color: #2563eb; font-weight: 700; text-decoration: none; }
        form, article { background: #fff; border: 1px solid #d9e1ec; border-radius: 8px; padding: 18px; margin-bottom: 14px; }
        textarea { width: 100%; min-height: 100px; box-sizing: border-box; border: 1px solid #c8d3e1; border-radius: 6px; padding: 10px; font: inherit; margin-bottom: 10px; }
        button { border: 0; border-radius: 6px; padding: 10px 14px; background: #172033; color: #fff; font-weight: 700; }
    </style>
</head>
<body>
<header><strong>AI Writing</strong><a href="/">Home</a></header>
<main>
    <form method="post" action="/ai/writing">
        <label>Prompt</label>
        <textarea name="prompt" required></textarea>
        <label>Your response</label>
        <textarea name="responseText" required></textarea>
        <button type="submit">Get feedback</button>
    </form>
    <article th:each="job : ${jobs}">
        <h2 th:text="${job.status}">COMPLETED</h2>
        <p><strong>Prompt:</strong> <span th:text="${job.prompt}">Prompt</span></p>
        <p><strong>Feedback:</strong> <span th:text="${job.feedback}">Feedback</span></p>
    </article>
</main>
</body>
</html>
