<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Writing</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v='app-shell-20260703-1')}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/shell :: topbar('Writing feedback', 'Practice TOEIC-style writing prompts without paid access')}"></div>
        <main class="app-content narrow">
            <form class="ew-card" method="post" action="/ai/writing">
                <label class="form-field">Prompt
                    <textarea name="prompt" required></textarea>
                </label>
                <label class="form-field">Your response
                    <textarea name="responseText" required></textarea>
                </label>
                <button type="submit">Get feedback</button>
            </form>
            <article class="ew-card" th:each="job : ${jobs}">
                <span class="ew-badge" th:text="${job.status}">COMPLETED</span>
                <p><strong>Prompt:</strong> <span th:text="${job.prompt}">Prompt</span></p>
                <p><strong>Feedback:</strong> <span th:text="${job.feedback}">Feedback</span></p>
            </article>
            <section class="ew-empty" th:if="${jobs.empty}">No writing feedback jobs yet.</section>
        </main>
    </div>
    <div th:replace="~{fragments/shell :: mobileNav}"></div>
</div>
<script th:src="@{/js/app-shell.js(v='app-shell-20260703-1')}"></script>
</body>
</html>
