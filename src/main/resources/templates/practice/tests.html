<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Tests - EnglishWebApp</title>
    <style>
        body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f5f7fb; color: #172033; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 18px 28px; background: #fff; border-bottom: 1px solid #d9e1ec; }
        main { width: min(94vw, 1040px); margin: 32px auto; }
        a { color: #2563eb; text-decoration: none; font-weight: 700; }
        .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 18px; background: #fff; border: 1px solid #d9e1ec; border-radius: 8px; padding: 18px; }
        label { display: grid; gap: 6px; font-weight: 700; color: #42526a; }
        input { border: 1px solid #c8d3e1; border-radius: 6px; padding: 10px 12px; font: inherit; min-width: 160px; }
        button, .button { border: 0; border-radius: 6px; padding: 10px 14px; background: #172033; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #d9e1ec; border-radius: 8px; overflow: hidden; }
        th, td { padding: 14px 16px; border-bottom: 1px solid #e7edf5; text-align: left; }
        th { color: #42526a; font-size: 0.9rem; }
        tr:last-child td { border-bottom: 0; }
        .empty { background: #fff; border: 1px solid #d9e1ec; border-radius: 8px; padding: 28px; color: #5f6f86; }
        .pagination { display: flex; gap: 10px; margin-top: 18px; align-items: center; }
        .muted { color: #5f6f86; }
    </style>
</head>
<body>
<header>
    <strong>EnglishWebApp</strong>
    <nav>
        <a href="/">Home</a>
        <span class="muted"> / </span>
        <a href="/history">History</a>
    </nav>
</header>
<main>
    <h1>Practice Tests</h1>
    <form class="toolbar" method="get" action="/tests">
        <label>Type
            <input name="type" th:value="${type}" placeholder="TOEIC">
        </label>
        <label>Difficulty
            <input name="difficulty" th:value="${difficulty}" placeholder="EASY">
        </label>
        <button type="submit">Filter</button>
        <a class="button" href="/tests">Clear</a>
    </form>

    <section class="empty" th:if="${tests.empty}">
        No tests found.
    </section>

    <table th:unless="${tests.empty}">
        <thead>
        <tr>
            <th>Title</th>
            <th>Type</th>
            <th>Difficulty</th>
            <th>Duration</th>
            <th>Version</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="test : ${tests.content}">
            <td th:text="${test.title}">TOEIC Mini</td>
            <td th:text="${test.type}">TOEIC</td>
            <td th:text="${test.difficulty} ?: 'Any'">EASY</td>
            <td><span th:text="${test.duration}">20</span> min</td>
            <td th:text="${test.version}">1</td>
            <td><a th:href="@{/tests/{id}/practice(id=${test.id})}">Start</a></td>
        </tr>
        </tbody>
    </table>

    <nav class="pagination" th:if="${tests.totalPages > 1}">
        <a th:if="${tests.hasPrevious()}"
           th:href="@{/tests(page=${tests.number - 1},size=${tests.size},type=${type},difficulty=${difficulty})}">Previous</a>
        <span>Page <strong th:text="${tests.number + 1}">1</strong> of <strong th:text="${tests.totalPages}">1</strong></span>
        <a th:if="${tests.hasNext()}"
           th:href="@{/tests(page=${tests.number + 1},size=${tests.size},type=${type},difficulty=${difficulty})}">Next</a>
    </nav>
</main>
</body>
</html>
