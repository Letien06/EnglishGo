<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${session.test.title} + ' - Practice'">Practice</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v='app-shell-20260703-1')}">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body th:attr="data-test-id=${session.test.id},data-duration=${session.test.duration},data-draft=${session.draftPayload}">
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar}"></div>
    <div class="app-main">
        <header class="app-topbar">
            <div>
                <p class="app-eyebrow">Practice mode</p>
                <h1 th:text="${session.test.title}">Practice</h1>
                <p>
                    <span th:text="${session.test.type}">TOEIC</span>
                    <span> / </span>
                    <span th:text="${session.test.difficulty} ?: 'Any difficulty'">EASY</span>
                </p>
            </div>
            <div class="app-topbar-actions">
                <span class="timer ew-badge" x-data="timer(Number(document.body.dataset.duration) * 60)" x-init="start()" x-text="label"></span>
                <a class="ew-button secondary compact" href="/tests">Exit</a>
            </div>
        </header>

        <main class="app-content wide" x-data="practicePage()" x-init="init()">
            <div class="page-grid">
                <section>
                    <div class="ew-card question-meta">
                        <div><strong>Type:</strong> <span th:text="${session.test.type}">TOEIC</span></div>
                        <div><strong>Difficulty:</strong> <span th:text="${session.test.difficulty} ?: 'Any'">EASY</span></div>
                        <div><strong>Questions:</strong> <span th:text="${session.questions.size()}">4</span></div>
                    </div>

                    <article class="question-card" th:each="question, iter : ${session.questions}" th:id="'q-' + ${question.id}" th:attr="data-question-id=${question.id}">
                        <h2>Question <span th:text="${iter.index + 1}">1</span> <small>(Part <span th:text="${question.part}">3</span>)</small></h2>
                        <div class="ew-alert" th:if="${question.group != null}">
                            <p th:text="${question.group.passageText}">Passage</p>
                            <audio th:if="${question.group.audioUrl != null}" controls th:src="${#strings.startsWith(question.group.audioUrl, 'http') ? question.group.audioUrl : '/media/' + question.group.audioUrl}"></audio>
                            <img th:if="${question.group.imageUrl != null}" th:src="${#strings.startsWith(question.group.imageUrl, 'http') ? question.group.imageUrl : '/media/' + question.group.imageUrl}" alt="Question group image" loading="lazy">
                        </div>
                        <p th:text="${question.content}">Question content</p>
                        <audio th:if="${question.audioUrl != null}" controls th:src="${#strings.startsWith(question.audioUrl, 'http') ? question.audioUrl : '/media/' + question.audioUrl}"></audio>
                        <img th:if="${question.imageUrl != null}" th:src="${#strings.startsWith(question.imageUrl, 'http') ? question.imageUrl : '/media/' + question.imageUrl}" alt="Question image" loading="lazy">

                        <div class="options" th:if="${session.optionsByQuestionId[question.id] != null and !session.optionsByQuestionId[question.id].empty}">
                            <label class="option" th:each="option : ${session.optionsByQuestionId[question.id]}">
                                <input type="radio" th:name="'question-' + ${question.id}" th:value="${option.id}" @change="changed()">
                                <span th:text="${option.content}">Option</span>
                            </label>
                        </div>

                        <div th:unless="${session.optionsByQuestionId[question.id] != null and !session.optionsByQuestionId[question.id].empty}">
                            <label class="form-field">
                                Answer
                                <textarea th:attr="data-text-question-id=${question.id}" @input="changed()"></textarea>
                            </label>
                        </div>
                    </article>
                </section>

                <aside class="ew-card sticky-panel">
                    <strong>Questions</strong>
                    <div class="question-nav-grid">
                        <a th:each="question, iter : ${session.questions}" th:href="'#q-' + ${question.id}" th:text="${iter.index + 1}">1</a>
                    </div>
                    <p class="muted" x-text="status"></p>
                    <div class="button-row">
                        <button type="button" @click="saveNow()">Save now</button>
                        <button class="secondary" type="button" @click="submit()">Submit test</button>
                    </div>
                </aside>
            </div>
        </main>
    </div>
    <div th:replace="~{fragments/shell :: mobileNav}"></div>
</div>

<script>
    function timer(seconds) {
        return {
            remaining: seconds,
            label: "",
            start() {
                this.render();
                setInterval(() => {
                    if (this.remaining > 0) {
                        this.remaining -= 1;
                        this.render();
                    }
                }, 1000);
            },
            render() {
                const minutes = Math.floor(this.remaining / 60).toString().padStart(2, "0");
                const seconds = (this.remaining % 60).toString().padStart(2, "0");
                this.label = `${minutes}:${seconds}`;
            }
        };
    }

    function practicePage() {
        return {
            testId: document.body.dataset.testId,
            status: "Draft not saved yet",
            timeoutId: null,
            init() {
                this.restore();
                window.addEventListener("beforeunload", () => localStorage.setItem(this.key(), JSON.stringify(this.collect())));
            },
            key() {
                return `practice:${this.testId}:answers`;
            },
            restore() {
                const localDraft = localStorage.getItem(this.key());
                const serverDraft = document.body.dataset.draft || "{}";
                const draft = JSON.parse(localDraft || serverDraft || "{}");
                Object.entries(draft.answers || {}).forEach(([questionId, answer]) => {
                    if (answer.selectedOptionId) {
                        const radio = document.querySelector(`input[name="question-${questionId}"][value="${answer.selectedOptionId}"]`);
                        if (radio) radio.checked = true;
                    }
                    if (answer.textResponse) {
                        const textarea = document.querySelector(`textarea[data-text-question-id="${questionId}"]`);
                        if (textarea) textarea.value = answer.textResponse;
                    }
                });
            },
            collect() {
                const answers = {};
                document.querySelectorAll("[data-question-id]").forEach((card) => {
                    const questionId = card.dataset.questionId;
                    const checked = card.querySelector(`input[name="question-${questionId}"]:checked`);
                    const textarea = card.querySelector(`textarea[data-text-question-id="${questionId}"]`);
                    answers[questionId] = {
                        selectedOptionId: checked ? Number(checked.value) : null,
                        textResponse: textarea ? textarea.value : null
                    };
                });
                return {answers};
            },
            changed() {
                localStorage.setItem(this.key(), JSON.stringify(this.collect()));
                this.status = "Changes pending";
                clearTimeout(this.timeoutId);
                this.timeoutId = setTimeout(() => this.saveNow(), 15000);
            },
            async saveNow() {
                const payload = JSON.stringify(this.collect());
                localStorage.setItem(this.key(), payload);
                const response = await fetch(`/api/practice/tests/${this.testId}/draft`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({payload})
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    this.status = result.error || "Save failed";
                    return;
                }
                this.status = `Saved at ${new Date().toLocaleTimeString()}`;
            },
            async submit() {
                await this.saveNow();
                const answers = Object.entries(this.collect().answers).map(([questionId, answer]) => ({
                    questionId: Number(questionId),
                    selectedOptionId: answer.selectedOptionId,
                    textResponse: answer.textResponse
                }));
                const response = await fetch(`/api/practice/tests/${this.testId}/submit`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({answers})
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    this.status = result.error || "Submit failed";
                    return;
                }
                localStorage.removeItem(this.key());
                window.location.href = `/attempts/${result.data.attemptId}/review`;
            }
        };
    }
</script>
<script th:src="@{/js/app-shell.js(v='app-shell-20260703-1')}"></script>
</body>
</html>
