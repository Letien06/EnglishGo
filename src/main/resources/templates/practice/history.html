<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - ENGLISHGO</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v='quy-ngu-skin-7')}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/shell :: topbar('Attempt history', 'Review submitted answers and explanations')}"></div>
        <main class="app-content">
            <section class="ew-empty" th:if="${attempts.empty}">No submitted attempts yet.</section>

            <section class="ew-card" th:unless="${attempts.empty}">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Test</th>
                        <th>Score</th>
                        <th>Submitted</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="attempt : ${attempts.content}">
                        <td th:text="${attempt.test.title}">TOEIC Mini</td>
                        <td><strong th:text="${attempt.score}">100</strong></td>
                        <td th:text="${attempt.submittedAt}">time</td>
                        <td><a th:href="@{/attempts/{id}/review(id=${attempt.id})}">Review</a></td>
                    </tr>
                    </tbody>
                </table>
            </section>

            <nav class="pagination" th:if="${attempts.totalPages > 1}">
                <a th:if="${attempts.hasPrevious()}" th:href="@{/history(page=${attempts.number - 1},size=${attempts.size})}">Previous</a>
                <span>Page <strong th:text="${attempts.number + 1}">1</strong> of <strong th:text="${attempts.totalPages}">1</strong></span>
                <a th:if="${attempts.hasNext()}" th:href="@{/history(page=${attempts.number + 1},size=${attempts.size})}">Next</a>
            </nav>
        </main>
    </div>
    <div th:replace="~{fragments/shell :: mobileNav}"></div>
</div>
<script th:src="@{/js/app-shell.js(v='quy-ngu-skin-7')}"></script>
</body>
</html>
