<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/shell :: topbar('Community', 'Ask questions and compare free learning progress')}"></div>
        <main class="app-content">
            <div class="page-grid">
                <section>
                    <div class="ew-card">
                        <h2>Discussion</h2>
                        <form method="post" action="/community/comments">
                            <label class="form-field">Message
                                <textarea name="content" required placeholder="Ask a question or share a learning tip"></textarea>
                            </label>
                            <button type="submit">Post</button>
                        </form>
                    </div>
                    <article class="ew-card" th:each="comment : ${comments}">
                        <strong th:text="${comment.user.displayName} ?: ${comment.user.email}">User</strong>
                        <p th:text="${comment.content}">Comment</p>
                    </article>
                    <section class="ew-empty" th:if="${comments.empty}">No comments yet.</section>
                </section>

                <aside class="ew-card sticky-panel">
                    <h2>Leaderboard</h2>
                    <p class="muted" th:if="${leaderboard.empty}">No scores yet.</p>
                    <ol>
                        <li th:each="entry : ${leaderboard}">
                            <span th:text="${entry.user.displayName} ?: ${entry.user.email}">User</span>
                            <strong th:text="${entry.score}">0</strong>
                        </li>
                    </ol>
                </aside>
            </div>
        </main>
    </div>
    <div th:replace="~{fragments/shell :: mobileNav}"></div>
</div>
<script th:src="@{/js/app-shell.js}"></script>
</body>
</html>
