<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community</title>
    <style>
        body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f5f7fb; color: #172033; }
        header { display: flex; justify-content: space-between; padding: 18px 28px; background: #fff; border-bottom: 1px solid #d9e1ec; }
        main { width: min(94vw, 1040px); margin: 32px auto; display: grid; grid-template-columns: 1fr 320px; gap: 18px; }
        @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
        a { color: #2563eb; font-weight: 700; text-decoration: none; }
        section, article { background: #fff; border: 1px solid #d9e1ec; border-radius: 8px; padding: 18px; margin-bottom: 14px; }
        textarea { width: 100%; min-height: 90px; box-sizing: border-box; border: 1px solid #c8d3e1; border-radius: 6px; padding: 10px; font: inherit; }
        button { border: 0; border-radius: 6px; padding: 10px 14px; background: #172033; color: #fff; font-weight: 700; margin-top: 8px; }
    </style>
</head>
<body>
<header><strong>Community</strong><a href="/">Home</a></header>
<main>
    <section>
        <h1>Discussion</h1>
        <form method="post" action="/community/comments">
            <textarea name="content" required placeholder="Ask a question or share a learning tip"></textarea>
            <button type="submit">Post</button>
        </form>
        <article th:each="comment : ${comments}">
            <strong th:text="${comment.user.displayName} ?: ${comment.user.email}">User</strong>
            <p th:text="${comment.content}">Comment</p>
        </article>
    </section>
    <aside>
        <section>
            <h2>Leaderboard</h2>
            <p th:if="${leaderboard.empty}">No scores yet.</p>
            <ol>
                <li th:each="entry : ${leaderboard}">
                    <span th:text="${entry.user.displayName} ?: ${entry.user.email}">User</span>
                    <strong th:text="${entry.score}">0</strong>
                </li>
            </ol>
        </section>
    </aside>
</main>
</body>
</html>
