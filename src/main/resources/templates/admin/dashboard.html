<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v='app-shell-20260703-1')}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/shell :: topbar('Admin', 'Content and learner operations')}"></div>
        <main class="app-content">
            <section class="card-grid">
                <article class="ew-card" th:each="metric : ${metrics}">
                    <span class="ew-badge" th:text="${metric.key}">metric</span>
                    <h2 th:text="${metric.value}">0</h2>
                </article>
            </section>
            <section class="ew-card">
                <h2>Modules</h2>
                <div class="button-row">
                    <a class="ew-button" href="/admin/listening">Listening</a>
                    <a class="ew-button" href="/admin/reading">Reading</a>
                    <a class="ew-button" href="/admin/vocabulary">Vocabulary</a>
                    <a class="ew-button" href="/admin/mock-test">Mock test</a>
                    <a class="ew-button secondary" href="/admin/generate">AI generator</a>
                    <a class="ew-button secondary" href="/admin/content-review">Review queue</a>
                </div>
            </section>
        </main>
    </div>
    <div th:replace="~{fragments/shell :: mobileNav}"></div>
</div>
<script th:src="@{/js/app-shell.js(v='app-shell-20260703-1')}"></script>
</body>
</html>
