<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Content</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v='app-shell-20260702-3')}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/shell :: topbar('Content modules', 'Manage content by TOEIC module')}"></div>
        <main class="app-content">
            <section class="card-grid">
                <article class="ew-card">
                    <span class="ew-badge">Listening</span>
                    <h2 th:text="${listeningQuestions}">0</h2>
                </article>
                <article class="ew-card">
                    <span class="ew-badge">Reading</span>
                    <h2 th:text="${readingQuestions}">0</h2>
                </article>
                <article class="ew-card">
                    <span class="ew-badge">Vocabulary</span>
                    <h2 th:text="${vocabWords}">0</h2>
                </article>
                <article class="ew-card">
                    <span class="ew-badge">Mock tests</span>
                    <h2 th:text="${mockTests}">0</h2>
                </article>
            </section>
        </main>
    </div>
    <div th:replace="~{fragments/shell :: mobileNav}"></div>
</div>
<script th:src="@{/js/app-shell.js(v='app-shell-20260702-3')}"></script>
</body>
</html>
