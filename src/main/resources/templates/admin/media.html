<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media - ENGLISHGO</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/admin-shell :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/admin-shell :: topbar('Media', 'Upload audio mp3 và hình ảnh jpg/png cho Question Bank')}"></div>
        <main class="app-content wide admin-page">
            <p class="admin-notice" th:if="${adminNotice}" th:text="${adminNotice}">Upload thành công.</p>
            <p class="admin-notice danger" th:if="${adminError}" th:text="${adminError}">Có lỗi.</p>

            <section class="ew-card admin-next-card">
                <header class="admin-section-head">
                    <div>
                        <span>Upload</span>
                        <h2>Tải file lên local storage</h2>
                        <p>Audio dùng mp3. Hình ảnh dùng jpg hoặc png. URL public sẽ có dạng `/media/...`.</p>
                    </div>
                </header>
                <form class="admin-form admin-inline-upload" method="post" action="/admin/media/upload" enctype="multipart/form-data">
                    <select name="mediaType" required>
                        <option th:each="type : ${mediaTypes}" th:value="${type}" th:text="${type}">AUDIO</option>
                    </select>
                    <input name="file" type="file" required>
                    <button class="admin-action-button publish" type="submit">Upload</button>
                </form>
            </section>

            <section class="ew-card">
                <header class="admin-section-head">
                    <div>
                        <span>Library</span>
                        <h2>Danh sách media</h2>
                    </div>
                </header>
                <div class="admin-table-wrap">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Type</th>
                            <th>File</th>
                            <th>Preview</th>
                            <th>URL</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="asset : ${assets.content}">
                            <td th:text="${asset.id}">1</td>
                            <td th:text="${asset.mediaType}">AUDIO</td>
                            <td>
                                <strong th:text="${asset.originalFileName}">file.mp3</strong>
                                <p th:text="${asset.contentType + ' · ' + asset.fileSize + ' bytes'}">audio/mpeg</p>
                            </td>
                            <td>
                                <audio th:if="${asset.mediaType.name() == 'AUDIO'}" th:src="${asset.publicUrl}" controls></audio>
                                <img class="admin-media-thumb" th:if="${asset.mediaType.name() == 'IMAGE'}" th:src="${asset.publicUrl}" alt="Preview">
                            </td>
                            <td>
                                <code th:text="${asset.publicUrl}">/media/audio/file.mp3</code>
                            </td>
                        </tr>
                        <tr th:if="${assets.empty}">
                            <td colspan="5">Chưa có media nào.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/app-shell.js}"></script>
</body>
</html>
