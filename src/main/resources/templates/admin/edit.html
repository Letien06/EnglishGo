<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Content - ENGLISHGO</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/shell :: topbar('Sửa nội dung', 'Cập nhật draft hoặc nội dung đã publish cho user học')}"></div>
        <main class="app-content wide admin-page">
            <nav th:replace="~{fragments/shell :: adminTabs}"></nav>

            <section class="ew-card" th:if="${editType == 'test'}">
                <h2>Sửa đề thi</h2>
                <form class="admin-form" method="post" th:action="@{/admin/tests/{id}(id=${test.id})}">
                    <label>Tiêu đề <input name="title" th:value="${test.title}" required></label>
                    <label>Loại <input name="type" th:value="${test.type}" required></label>
                    <label>Thời lượng <input name="duration" type="number" th:value="${test.duration}" min="1" required></label>
                    <label>Nhãn nguồn <input name="difficulty" th:value="${test.difficulty}"></label>
                    <label>Trạng thái
                        <select name="status">
                            <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == test.status}">DRAFT</option>
                        </select>
                    </label>
                    <label>Nguồn
                        <select name="sourceType">
                            <option th:each="sourceType : ${sourceTypes}" th:value="${sourceType}" th:text="${sourceType}" th:selected="${sourceType == test.sourceType}">MANUAL</option>
                        </select>
                    </label>
                    <label>Ghi chú nguồn <textarea name="sourceNote" th:text="${test.sourceNote}"></textarea></label>
                    <label>Ghi chú bản quyền <textarea name="licenseNote" th:text="${test.licenseNote}"></textarea></label>
                    <div class="admin-form-actions">
                        <a href="/admin/mock-test">Hủy</a>
                        <button type="submit">Lưu thay đổi</button>
                    </div>
                </form>
            </section>

            <section class="ew-card" th:if="${editType == 'question'}">
                <h2>Sửa câu hỏi</h2>
                <form class="admin-form" method="post" th:action="@{/admin/questions/{id}(id=${question.id})}">
                    <input type="hidden" name="redirectTo" value="/admin/content-review">
                    <p class="admin-readonly-line">
                        <strong>Đề thi / ngân hàng:</strong>
                        <span th:text="${question.test != null ? question.test.title : 'Chưa gắn đề'}">Test</span>
                    </p>
                    <label>Part <input name="part" type="number" th:value="${question.part}" min="1" max="7" required></label>
                    <label>Type <input name="type" th:value="${question.type}" required></label>
                    <label>Nội dung <textarea name="content" th:text="${question.content}" required></textarea></label>
                    <label>Audio URL <input name="audioUrl" th:value="${question.audioUrl}"></label>
                    <label>Image URL <input name="imageUrl" th:value="${question.imageUrl}"></label>
                    <label>Giải thích <textarea name="explanation" th:text="${question.explanation}"></textarea></label>
                    <label>Option A <input name="optionA" th:value="${optionA}"></label>
                    <label>Option B <input name="optionB" th:value="${optionB}"></label>
                    <label>Option C <input name="optionC" th:value="${optionC}"></label>
                    <label>Option D <input name="optionD" th:value="${optionD}"></label>
                    <label>Đáp án đúng
                        <select name="correctOption">
                            <option value="A" th:selected="${correctOption == 'A'}">A</option>
                            <option value="B" th:selected="${correctOption == 'B'}">B</option>
                            <option value="C" th:selected="${correctOption == 'C'}">C</option>
                            <option value="D" th:selected="${correctOption == 'D'}">D</option>
                        </select>
                    </label>
                    <label>Accepted answer cho text/dictation <input name="acceptedAnswer" th:value="${acceptedAnswer}"></label>
                    <label>Trạng thái
                        <select name="status">
                            <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == question.status}">DRAFT</option>
                        </select>
                    </label>
                    <label>Nguồn
                        <select name="sourceType">
                            <option th:each="sourceType : ${sourceTypes}" th:value="${sourceType}" th:text="${sourceType}" th:selected="${sourceType == question.sourceType}">MANUAL</option>
                        </select>
                    </label>
                    <label>Ghi chú nguồn <textarea name="sourceNote" th:text="${question.sourceNote}"></textarea></label>
                    <label>Ghi chú bản quyền <textarea name="licenseNote" th:text="${question.licenseNote}"></textarea></label>
                    <div class="admin-form-actions">
                        <a href="/admin/content-review">Hủy</a>
                        <button type="submit">Lưu thay đổi</button>
                    </div>
                </form>
            </section>

            <section class="ew-card" th:if="${editType == 'lesson'}">
                <h2>Sửa bài đọc / bài học</h2>
                <form class="admin-form" method="post" th:action="@{/admin/lessons/{id}(id=${lesson.id})}">
                    <input type="hidden" name="redirectTo" value="/admin/reading">
                    <label>Tiêu đề <input name="title" th:value="${lesson.title}" required></label>
                    <label>Chủ đề <input name="topic" th:value="${lesson.topic}" required></label>
                    <label>Nội dung <textarea name="content" th:text="${lesson.content}" required></textarea></label>
                    <label>Video URL <input name="videoUrl" th:value="${lesson.videoUrl}"></label>
                    <label>Trạng thái
                        <select name="status">
                            <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == lesson.status}">DRAFT</option>
                        </select>
                    </label>
                    <label>Nguồn
                        <select name="sourceType">
                            <option th:each="sourceType : ${sourceTypes}" th:value="${sourceType}" th:text="${sourceType}" th:selected="${sourceType == lesson.sourceType}">MANUAL</option>
                        </select>
                    </label>
                    <label>Ghi chú nguồn <textarea name="sourceNote" th:text="${lesson.sourceNote}"></textarea></label>
                    <label>Ghi chú bản quyền <textarea name="licenseNote" th:text="${lesson.licenseNote}"></textarea></label>
                    <div class="admin-form-actions">
                        <a href="/admin/reading">Hủy</a>
                        <button type="submit">Lưu thay đổi</button>
                    </div>
                </form>
            </section>

            <section class="ew-card" th:if="${editType == 'vocabSet'}">
                <h2>Sửa bộ từ vựng</h2>
                <form class="admin-form" method="post" th:action="@{/admin/vocab-sets/{id}(id=${vocabSet.id})}">
                    <input type="hidden" name="redirectTo" value="/admin/vocabulary">
                    <label>Tiêu đề <input name="title" th:value="${vocabSet.title}" required></label>
                    <label>Topic <input name="topic" th:value="${vocabSet.topic}" required></label>
                    <label>Level <input name="level" th:value="${vocabSet.level}"></label>
                    <label>Trạng thái
                        <select name="status">
                            <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == vocabSet.status}">DRAFT</option>
                        </select>
                    </label>
                    <label>Nguồn
                        <select name="sourceType">
                            <option th:each="sourceType : ${sourceTypes}" th:value="${sourceType}" th:text="${sourceType}" th:selected="${sourceType == vocabSet.sourceType}">MANUAL</option>
                        </select>
                    </label>
                    <label>Ghi chú nguồn <textarea name="sourceNote" th:text="${vocabSet.sourceNote}"></textarea></label>
                    <label>Ghi chú bản quyền <textarea name="licenseNote" th:text="${vocabSet.licenseNote}"></textarea></label>
                    <div class="admin-form-actions">
                        <a href="/admin/vocabulary">Hủy</a>
                        <button type="submit">Lưu thay đổi</button>
                    </div>
                </form>
            </section>

            <section class="ew-card" th:if="${editType == 'vocabWord'}">
                <h2>Sửa từ vựng</h2>
                <form class="admin-form" method="post" th:action="@{/admin/vocab-words/{id}(id=${vocabWord.id})}">
                    <input type="hidden" name="redirectTo" value="/admin/vocabulary">
                    <label>Bộ từ
                        <select name="setId" required>
                            <option th:each="set : ${vocabSets}" th:value="${set.id}" th:text="${set.title}" th:selected="${vocabWord.set != null and set.id == vocabWord.set.id}">Set</option>
                        </select>
                    </label>
                    <label>Word <input name="word" th:value="${vocabWord.word}" required></label>
                    <label>Meaning <textarea name="meaning" th:text="${vocabWord.meaning}" required></textarea></label>
                    <label>Phonetic <input name="phonetic" th:value="${vocabWord.phonetic}"></label>
                    <label>Example <textarea name="example" th:text="${vocabWord.example}"></textarea></label>
                    <label>Audio URL <input name="audioUrl" th:value="${vocabWord.audioUrl}"></label>
                    <label>Trạng thái
                        <select name="status">
                            <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == vocabWord.status}">DRAFT</option>
                        </select>
                    </label>
                    <label>Nguồn
                        <select name="sourceType">
                            <option th:each="sourceType : ${sourceTypes}" th:value="${sourceType}" th:text="${sourceType}" th:selected="${sourceType == vocabWord.sourceType}">MANUAL</option>
                        </select>
                    </label>
                    <label>Ghi chú nguồn <textarea name="sourceNote" th:text="${vocabWord.sourceNote}"></textarea></label>
                    <label>Ghi chú bản quyền <textarea name="licenseNote" th:text="${vocabWord.licenseNote}"></textarea></label>
                    <div class="admin-form-actions">
                        <a href="/admin/vocabulary">Hủy</a>
                        <button type="submit">Lưu thay đổi</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
    <div th:replace="~{fragments/shell :: mobileNav}"></div>
</div>
<script th:src="@{/js/app-shell.js}"></script>
</body>
</html>
