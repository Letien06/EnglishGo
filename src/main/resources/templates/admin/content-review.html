<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Review</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v='quy-ngu-skin-7')}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/shell :: topbar('Content review', 'Approve drafts before publishing')}"></div>
        <main class="app-content">
            <section class="ew-card">
                <span class="ew-badge">Draft queue</span>
                <h2 th:text="${draftQuestions}">0</h2>
                <p class="muted">Draft questions are counted from the existing question bank status.</p>
            </section>
        </main>
    </div>
    <div th:replace="~{fragments/shell :: mobileNav}"></div>
</div>
<script th:src="@{/js/app-shell.js(v='quy-ngu-skin-7')}"></script>
</body>
</html>
