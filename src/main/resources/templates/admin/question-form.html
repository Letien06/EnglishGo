<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu hỏi - ENGLISHGO</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/admin-shell :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/admin-shell :: topbar(${isEdit} ? 'Sửa câu hỏi' : 'Tạo câu hỏi', 'Lưu draft hoặc publish vào ngân hàng câu hỏi')}"></div>
        <main class="app-content wide admin-page">
            <p class="admin-notice danger" th:if="${adminError}" th:text="${adminError}">Có lỗi.</p>

            <section class="ew-card admin-next-card">
                <form class="admin-form question-bank-form" method="post"
                      th:action="${isEdit} ? @{/admin/question-bank/{id}(id=${question.id})} : @{/admin/question-bank}">
                    <div class="admin-form-grid">
                        <label>
                            Kỹ năng
                            <select name="skillType" required>
                                <option th:each="skill : ${skillTypes}"
                                        th:value="${skill}"
                                        th:text="${skill}"
                                        th:selected="${question == null ? skill.name() == 'LISTENING' : skill == question.skillType}">LISTENING</option>
                            </select>
                        </label>
                        <label>
                            TOEIC Part
                            <select name="part" required>
                                <option th:each="toeicPart : ${toeicParts}"
                                        th:value="${toeicPart}"
                                        th:text="${toeicPart}"
                                        th:selected="${question == null ? toeicPart.name() == 'PART_1' : toeicPart == question.part}">PART_1</option>
                            </select>
                        </label>
                        <label>
                            Độ khó
                            <select name="difficultyLevel" required>
                                <option th:each="level : ${#numbers.sequence(1,5)}"
                                        th:value="${level}"
                                        th:text="${'Level ' + level}"
                                        th:selected="${question == null ? level == 3 : level == question.difficultyLevel}">Level 3</option>
                            </select>
                        </label>
                        <label>
                            Nhóm câu hỏi
                            <select name="groupId">
                                <option value="">Không dùng group</option>
                                <option th:each="group : ${groups}"
                                        th:value="${group.id}"
                                        th:text="${group.skillType + ' PART_' + group.part + ' - ' + group.title}"
                                        th:selected="${question != null && question.groupId != null && question.groupId == group.id}">Group</option>
                            </select>
                        </label>
                    </div>

                    <label>
                        Nội dung câu hỏi
                        <textarea name="content" rows="4" required th:text="${question != null ? question.content : ''}"></textarea>
                    </label>

                    <div class="admin-upload-grid">
                        <label>
                            Audio URL
                            <input name="audioUrl" id="audioUrl" th:value="${question != null ? question.audioUrl : ''}" placeholder="/media/audio/file.mp3">
                            <input type="file" id="audioUpload" accept="audio/mpeg,audio/mp3">
                        </label>
                        <div class="admin-preview-box">
                            <audio id="audioPreview" controls th:src="${question != null ? question.audioUrl : ''}"></audio>
                        </div>
                        <label>
                            Image URL
                            <input name="imageUrl" id="imageUrl" th:value="${question != null ? question.imageUrl : ''}" placeholder="/media/images/file.png">
                            <input type="file" id="imageUpload" accept="image/png,image/jpeg">
                        </label>
                        <div class="admin-preview-box">
                            <img id="imagePreview" alt="Preview ảnh" th:src="${question != null ? question.imageUrl : ''}">
                        </div>
                    </div>

                    <div class="admin-answer-grid">
                        <label>Đáp án A <input name="answerA" th:value="${answerA ?: ''}" required></label>
                        <label>Đáp án B <input name="answerB" th:value="${answerB ?: ''}" required></label>
                        <label>Đáp án C <input name="answerC" th:value="${answerC ?: ''}"></label>
                        <label>Đáp án D <input name="answerD" th:value="${answerD ?: ''}"></label>
                    </div>

                    <label>
                        Đáp án đúng
                        <select name="correctAnswer">
                            <option value="A" th:selected="${correctAnswer == null || correctAnswer == 'A'}">A</option>
                            <option value="B" th:selected="${correctAnswer == 'B'}">B</option>
                            <option value="C" th:selected="${correctAnswer == 'C'}">C</option>
                            <option value="D" th:selected="${correctAnswer == 'D'}">D</option>
                        </select>
                    </label>

                    <label>
                        Giải thích
                        <textarea name="explanation" rows="3" th:text="${question != null ? question.explanation : ''}"></textarea>
                    </label>

                    <div class="admin-form-actions">
                        <button class="admin-action-button archive" name="action" value="draft" type="submit">Lưu draft</button>
                        <button class="admin-action-button publish" name="action" value="publish" type="submit">Lưu và publish</button>
                        <a href="/admin/question-bank">Quay lại</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/app-shell.js}"></script>
<script>
const uploadMedia = async (fileInput, mediaType, urlInput, preview) => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    const body = new FormData();
    body.append('mediaType', mediaType);
    body.append('file', file);
    const response = await fetch('/admin/api/media/upload', { method: 'POST', body });
    if (!response.ok) {
        alert('Upload không thành công.');
        return;
    }
    const data = await response.json();
    urlInput.value = data.publicUrl;
    preview.src = data.publicUrl;
};

document.getElementById('audioUpload')?.addEventListener('change', (event) => {
    uploadMedia(event.currentTarget, 'AUDIO', document.getElementById('audioUrl'), document.getElementById('audioPreview'));
});
document.getElementById('imageUpload')?.addEventListener('change', (event) => {
    uploadMedia(event.currentTarget, 'IMAGE', document.getElementById('imageUrl'), document.getElementById('imagePreview'));
});
</script>
</body>
</html>
